<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>くるむ薬局 札幌店 業務日報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* ============================================================
   トークン ― 明暗どちらでも同じ役割で解決するよう、色は必ずここ経由
   ============================================================ */
:root{
  --ground:#f4f7f5;
  --surface:#ffffff;
  --surface-2:#eef2f0;
  --line:#dae2de;
  --line-strong:#c3cec9;
  --ink:#16211d;
  --ink-2:#41514b;
  --muted:#6b7c75;
  --accent:#0f766e;
  --accent-ink:#ffffff;
  --accent-soft:#d7ece8;
  --ok:#15803d;      --ok-soft:#dcf0e2;
  --warn:#b45309;    --warn-soft:#fbeed8;
  --crit:#b91c1c;    --crit-soft:#fbe0de;
  --info:#1d4ed8;    --info-soft:#dee6fb;
  --shadow:0 1px 2px rgba(22,33,29,.06), 0 8px 24px -12px rgba(22,33,29,.18);
  --r:12px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0e1614;
    --surface:#16211e;
    --surface-2:#1d2926;
    --line:#2a3733;
    --line-strong:#3b4a45;
    --ink:#e7efeb;
    --ink-2:#b8c7c1;
    --muted:#8b9c95;
    --accent:#2dd4bf;
    --accent-ink:#08201d;
    --accent-soft:#123330;
    --ok:#4ade80;      --ok-soft:#12301f;
    --warn:#fbbf24;    --warn-soft:#33260c;
    --crit:#f87171;    --crit-soft:#361715;
    --info:#93b4fd;    --info-soft:#152340;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1614;
  --surface:#16211e;
  --surface-2:#1d2926;
  --line:#2a3733;
  --line-strong:#3b4a45;
  --ink:#e7efeb;
  --ink-2:#b8c7c1;
  --muted:#8b9c95;
  --accent:#2dd4bf;
  --accent-ink:#08201d;
  --accent-soft:#123330;
  --ok:#4ade80;      --ok-soft:#12301f;
  --warn:#fbbf24;    --warn-soft:#33260c;
  --crit:#f87171;    --crit-soft:#361715;
  --info:#93b4fd;    --info-soft:#152340;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ============================================================
   骨格 ― スマホは1カラム、PCは「週の状況 / 入力」の2カラム
   ============================================================ */
.shell{max-width:1040px;margin:0 auto;padding:0 14px 40px}

.topbar{
  /* sticky なので、中の .pickme はこのバーを基準に置ける */
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:saturate(1.4) blur(8px);
  border-bottom:1px solid var(--line);
  margin:0 -14px 16px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.topbar .grow{flex:1}

.who{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:4px 6px 4px 12px;box-shadow:var(--shadow);
}
.who label{font-size:11px;color:var(--muted);letter-spacing:.04em}
.who select{border:0;background:transparent;font-size:13px;font-weight:600;padding:2px 4px;
  max-width:8.5em;cursor:pointer}
/* Googleアカウントで本人確認しているとき ― 選べないことが信頼の根拠なので、静的に出す */
.who.signed{padding:4px 14px;flex-direction:column;align-items:flex-start;line-height:1.25}
.who.signed .nm{font-size:13px;font-weight:700;white-space:nowrap}
.who.signed .em{font-family:var(--mono);font-size:9.5px;color:var(--muted);
  max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who.unknown{border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-soft)}
.who.unknown .nm{color:var(--crit)}
/* 担当者が未選択のとき。押印の名前が決まらないので、ここを促す */
.who.need{border-color:var(--warn);background:var(--warn-soft);animation:nudge .45s ease}
.who.need select{color:var(--warn)}
@keyframes nudge{
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}
}
.pickme[hidden]{display:none}
.pickme{
  position:absolute;top:100%;right:74px;margin-top:6px;z-index:40;
  display:flex;align-items:center;gap:6px;max-width:min(19em,calc(100vw - 24px));
  padding:8px 12px;border-radius:10px;
  background:var(--ink);color:var(--surface);font-size:12px;line-height:1.5;
  box-shadow:0 8px 22px rgba(0,0,0,.22);
}
.pickme::before{
  content:"";position:absolute;top:-5px;right:26px;width:10px;height:10px;
  background:var(--ink);transform:rotate(45deg);
}
@media (max-width:400px){ .pickme{right:12px} }
@media (max-width:400px){
  .who label{display:none}
  .who.signed .em{max-width:8em}
}

/* 名簿にないアカウントの案内 */
.blockmsg{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--crit-soft);border:1px solid color-mix(in srgb,var(--crit) 30%,transparent);
  color:var(--crit);border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.65;
  margin-bottom:14px;
}
.blockmsg b{display:block;font-family:var(--disp);font-size:13.5px;margin-bottom:2px}

.cols{display:grid;gap:16px}
@media (min-width:880px){
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
  .col-right{position:sticky;top:88px}
}

/* ============================================================
   カード
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.card + .card{margin-top:16px}
.card-hd{
  display:flex;align-items:baseline;gap:10px;
  padding:14px 16px 0;
}
.card-hd h2{
  font-family:var(--disp);font-weight:700;font-size:13px;margin:0;
  letter-spacing:.08em;color:var(--ink-2);
}
.card-hd .note{font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.card-bd{padding:14px 16px 16px}

/* ---- 本日の状態(この画面の主役) ---- */
.today{padding:18px 16px 16px;display:flex;gap:14px;align-items:flex-start}
.today .dateblock{
  flex:0 0 auto;text-align:center;padding:8px 12px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line);min-width:72px;
}
.today .dateblock .md{font-family:var(--mono);font-size:22px;font-weight:600;
  letter-spacing:-.02em;display:block;line-height:1.2}
.today .dateblock .dow{font-size:11px;color:var(--muted);letter-spacing:.1em}
.today .msg{flex:1;min-width:0}
.today .msg .state{font-family:var(--disp);font-weight:700;font-size:19px;
  letter-spacing:.01em;text-wrap:balance;margin:0 0 2px}
.today .msg .sub{font-size:12.5px;color:var(--muted)}
.today.is-todo .msg .state{color:var(--warn)}
.today.is-done .msg .state{color:var(--ok)}
.today.is-lock .msg .state{color:var(--info)}

/* ---- 状態チップ ---- */
.chip{
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  font-size:11px;font-weight:700;letter-spacing:.04em;
  padding:2px 9px 2px 7px;border-radius:999px;border:1px solid transparent;
}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.chip.todo{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.chip.done{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.chip.lock{color:var(--info);background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 25%,transparent)}
.chip.appr{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.off {color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.chip.lock::before{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---- 週の移動 ---- */
.weeknav{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 16px 10px;border-top:1px solid var(--line);
}
.navbtn{
  display:inline-flex;align-items:center;gap:3px;
  padding:7px 11px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);
  cursor:pointer;transition:background .12s ease,border-color .12s ease,opacity .12s ease;
}
.navbtn:hover:not(:disabled){background:var(--surface-2)}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.navbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.navbtn.now{border-style:dashed}
.weeknav .jump{display:flex;align-items:center;gap:6px;margin-left:auto}
.weeknav .jump span{font-size:11px;color:var(--muted);white-space:nowrap}
.weeknav .jump input{
  padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);font-family:var(--mono);font-size:12px;color:var(--ink-2);
}
@media (max-width:400px){ .weeknav .jump{margin-left:0;width:100%} }

.pastbar[hidden]{display:none}
.pastbar{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  padding:8px 16px;background:var(--info-soft);
  border-top:1px solid color-mix(in srgb,var(--info) 22%,transparent);
  font-size:11.5px;color:var(--ink-2);
}

/* ---- 入力もれ ---- */
.card-bd.tight{padding:12px 16px 14px}
.missrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.missrow label{font-size:11.5px;color:var(--muted)}
.missrow select{
  padding:7px 9px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);font:inherit;font-size:12.5px;color:var(--ink-2);
}
.btn.ghost.sm{padding:7px 13px;font-size:12.5px;border-radius:8px}
.misslist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.misslist:empty{display:none}
.missday{
  display:inline-flex;align-items:baseline;gap:5px;
  padding:6px 10px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);font-family:var(--mono);font-size:12px;font-weight:600;
  color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums;
}
.missday:hover{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.missday .dw{font-family:var(--body);font-size:10.5px;font-weight:500;color:var(--muted)}
.missday.lock{border-style:dashed;color:var(--info)}
.missnone{font-size:12px;color:var(--muted);margin-top:10px}

/* ---- 週の一覧(印刷が1週間1ページなので、週が単位) ---- */
.week{display:flex;flex-direction:column}
.day{
  display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;
  width:100%;text-align:left;background:transparent;border:0;
  border-top:1px solid var(--line);padding:10px 16px;cursor:pointer;
}
.day:first-child{border-top:0}
.day:hover{background:var(--surface-2)}
.day[aria-current="true"]{background:var(--accent-soft)}
.day[aria-current="true"] .d-date{color:var(--accent)}
.day:disabled{cursor:default;opacity:.5}
.d-date{font-family:var(--mono);font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.d-date .dw{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:3px}
.d-vals{font-family:var(--mono);font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-vals b{color:var(--ink-2);font-weight:500}
.d-vals .bad{color:var(--crit);font-weight:600}

/* ---- 入力フォーム ---- */
.fields{display:grid;gap:12px}
@media (min-width:420px){ .fields{grid-template-columns:1fr 1fr} }
.field{display:flex;flex-direction:column;gap:5px}
.field > label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.field .hint{font-size:11px;color:var(--muted)}
.inputwrap{position:relative;display:flex;align-items:center}
.inputwrap input{
  width:100%;padding:12px 44px 12px 14px;
  background:var(--surface);border:1.5px solid var(--line-strong);border-radius:10px;
  font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.inputwrap input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.inputwrap input:disabled{background:var(--surface-2);color:var(--muted)}
.inputwrap .unit{position:absolute;right:14px;font-size:13px;color:var(--muted);pointer-events:none}
.field.out-of-range .inputwrap input{border-color:var(--crit)}
.field .alarm{font-size:11.5px;font-weight:600;color:var(--crit);display:none}
.field.out-of-range .alarm{display:block}

/* グループ見出し */
.grouphd{
  grid-column:1 / -1;font-family:var(--disp);font-size:11px;font-weight:700;
  letter-spacing:.12em;color:var(--muted);margin:10px 0 -4px;
  display:flex;align-items:center;gap:8px;
}
.grouphd:first-child{margin-top:0}
.grouphd::after{content:"";flex:1;height:1px;background:var(--line)}

/* 文字を入れる欄は等幅・大きめをやめて普通の書体に */
.field.txt .inputwrap input{
  font-family:var(--body);font-size:15px;font-weight:400;padding:11px 14px;
}
.field.txt select{
  width:100%;padding:11px 14px;border:1.5px solid var(--line-strong);border-radius:10px;
  background:var(--surface);font-size:15px;
}
.field.txt select:focus{outline:none;border-color:var(--accent)}

/* 管理に関する事項(譲渡記録) */
.xfer{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.xfer-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xfer-hd h3{
  font-family:var(--disp);font-size:13px;font-weight:700;margin:0;color:var(--ink-2);
  letter-spacing:.04em;flex:1;min-width:10em;
}
.toggle{
  border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;
  padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  color:var(--muted);
}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggle:disabled{opacity:.45;cursor:not-allowed}
.xfer-note{font-size:11.5px;color:var(--muted);width:100%;line-height:1.6;margin-top:2px}
.xfer-body{display:grid;gap:12px;margin-top:14px}
@media (min-width:420px){ .xfer-body{grid-template-columns:1fr 1fr} }
.xfer-body .wide{grid-column:1 / -1}

/* ---- 押印欄 ---- */
.seals{display:flex;gap:10px;margin-top:14px}
.seal{
  flex:1;border:1px dashed var(--line-strong);border-radius:10px;
  padding:10px;text-align:center;background:var(--surface-2);
}
.seal .cap{font-size:10px;letter-spacing:.1em;color:var(--muted);display:block}
.seal .stamp{width:42px;height:42px;object-fit:contain;display:block;margin:4px auto 2px}
.seal .name{font-family:var(--disp);font-weight:700;font-size:14px;margin-top:3px;
  display:block;min-height:1.5em}
.seal .at{font-family:var(--mono);font-size:10px;color:var(--muted)}
.seal.filled{border-style:solid;border-color:color-mix(in srgb,var(--crit) 40%,transparent);
  background:var(--surface)}
.seal.filled .name{color:var(--crit)}
/* 印影は入っているが、まだ承認されていない状態 */
.seal.await{border-style:dashed;border-color:var(--line-strong)}
.seal.await .name{color:var(--ink-2)}
.seal.await .stamp{opacity:.55}
.seal.await .at{color:var(--warn);font-family:var(--body);font-weight:600}

/* ---- ボタン ---- */
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{
  flex:1;min-width:130px;padding:13px 18px;border-radius:10px;border:1.5px solid var(--line-strong);
  background:var(--surface);font-family:var(--disp);font-weight:700;font-size:15px;
  cursor:pointer;transition:transform .08s ease, background .12s ease, border-color .12s ease;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{flex:0 0 auto;min-width:0;font-size:13px;padding:10px 14px}

/* ---- 通知バー ---- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:60;max-width:min(520px,calc(100vw - 28px));
  padding:11px 16px;border-radius:10px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  background:var(--ink);color:var(--ground);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--crit);color:#fff}

.skeleton{height:96px;border-radius:var(--r);background:
  linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);
  background-size:400% 100%;animation:sh 1.2s ease infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

.footnote{font-size:11.5px;color:var(--muted);margin:14px 2px 0;line-height:1.7}
.demo{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;margin-bottom:14px}
.linkbtn{background:none;border:0;padding:0;margin-left:6px;font:inherit;
  color:inherit;text-decoration:underline;cursor:pointer}

/* ============================================================
   画面の切り替え(トップバーの丸ボタン)
   入力 / 記録簿 / 出力 を行き来する。同時に出すと縦に長くなるので、
   選んだ画面だけを表示する。名簿だけは設定なのでモーダルのまま。
   ============================================================ */
.topnav{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.topnav .navsep{width:1px;height:26px;background:var(--line);margin:0 1px;align-self:center}

.navcircle{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:0;cursor:pointer;flex:0 0 auto;
}
.navcircle .ring{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;
  transition:background .12s ease, border-color .12s ease, transform .08s ease;
}
.navcircle .ring svg{
  width:19px;height:19px;stroke:var(--ink-2);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.navcircle .cap{font-size:9.5px;color:var(--muted);letter-spacing:.04em;line-height:1}
.navcircle:hover .ring{border-color:var(--line-strong)}
.navcircle:active .ring{transform:translateY(1px)}
/* 選択中。名簿ボタンは aria-pressed を持たないので光らない */
.navcircle[aria-pressed="true"] .ring{background:var(--accent);border-color:var(--accent)}
.navcircle[aria-pressed="true"] .ring svg{stroke:var(--accent-ink)}
.navcircle[aria-pressed="true"] .cap{color:var(--accent);font-weight:700}
/* 記録簿に未保存があるときの目印 */
.navcircle .dot{
  position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;
  background:var(--warn);border:2px solid var(--ground);
}
.navcircle .ring{position:relative}
@media (max-width:380px){
  .navcircle .ring{width:34px;height:34px}
  .navcircle .cap{font-size:9px}
}

/* ============================================================
   担当者の管理(モーダル)
   ============================================================ */
.iconbtn{
  flex:0 0 auto;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer;padding:0;
}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.7}
.iconbtn:hover{border-color:var(--line-strong)}

.overlay{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(10,20,17,.45);
  align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex}
@media (min-width:640px){ .overlay{align-items:center} }

.sheet{
  background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;
  border-radius:16px 16px 0 0;border:1px solid var(--line);
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
@media (min-width:640px){ .sheet{border-radius:16px} }

.sheet-hd{
  position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:16px 18px 12px;display:flex;align-items:center;gap:10px;
}
.sheet-hd h2{font-family:var(--disp);font-weight:700;font-size:16px;margin:0;flex:1}
.sheet-bd{padding:16px 18px}

/* 名簿の行 */
.mrow{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:11px 0;border-top:1px solid var(--line);
}
.mrow:first-of-type{border-top:0}
.mrow .mn{font-family:var(--disp);font-weight:700;font-size:14.5px;flex:1;min-width:7em}
.mrow.retired .mn{color:var(--muted);text-decoration:line-through}
.mini{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
  padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.mini:hover{border-color:var(--accent)}
.mini.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.mini:disabled{opacity:.4;cursor:not-allowed}
.mrow .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:100%;
  order:9;margin-top:-2px}

.addrow{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:2px solid var(--line)}
.addrow input{
  flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--line-strong);border-radius:10px;
  background:var(--surface);font-size:15px;
}
.addrow input:focus{outline:none;border-color:var(--accent)}

/* ---- 印影 ---- */
.sealbtn{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
  padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;
}
.sealbtn:hover{border-color:var(--accent)}
.sealbtn img{width:26px;height:26px;object-fit:contain;display:block}
.sealbtn.has{color:var(--ink-2)}
.sealbtn .no{width:26px;height:26px;border:1px dashed var(--line-strong);border-radius:50%;
  display:grid;place-items:center;font-size:9px;color:var(--muted)}

.sealedit{padding:4px 0}
.sealedit h3{font-family:var(--disp);font-size:15px;margin:0 0 4px}
.sealedit p.lead{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.7}
.previews{display:flex;gap:16px;align-items:flex-start;justify-content:center;
  flex-wrap:wrap;margin-bottom:16px}
.pv{text-align:center}
.pv .cap{font-size:10.5px;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:6px}
.pv .frame{
  width:112px;height:112px;border:1px solid var(--line);border-radius:10px;
  display:grid;place-items:center;overflow:hidden;
  background:
    linear-gradient(45deg,var(--surface-2) 25%,transparent 25%,transparent 75%,var(--surface-2) 75%),
    linear-gradient(45deg,var(--surface-2) 25%,transparent 25%,transparent 75%,var(--surface-2) 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:var(--surface);
}
.pv .frame img,.pv .frame canvas{max-width:100%;max-height:100%;display:block}
.pv .frame.empty{color:var(--muted);font-size:11px}

.slider{margin:4px 0 16px}
.slider label{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.slider input[type="range"]{width:100%;accent-color:var(--accent);margin-top:4px}

.filepick{
  display:block;width:100%;text-align:center;padding:13px;border-radius:10px;
  border:1.5px dashed var(--line-strong);background:var(--surface-2);
  font-family:var(--disp);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:14px;
}
.filepick:hover{border-color:var(--accent);color:var(--accent)}

/* ---- 管理画面のタブ ---- */
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);
  position:sticky;top:52px;background:var(--surface);z-index:2}
.tab{
  border:0;background:none;padding:9px 12px 8px;cursor:pointer;
  font-family:var(--disp);font-weight:700;font-size:13px;color:var(--muted);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* ---- 現任の管理薬剤師 ---- */
.chief{
  display:flex;align-items:center;gap:12px;
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);
  border-radius:12px;padding:13px 15px;margin-bottom:16px;
}
.chief .ttl{font-size:10.5px;letter-spacing:.1em;color:var(--accent);display:block;font-weight:700}
.chief .nm{font-family:var(--disp);font-weight:700;font-size:17px;display:block;line-height:1.3}
.chief .sub{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.chief.none{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.chief.none .ttl,.chief.none .nm{color:var(--warn)}

/* ---- 任期の一覧 ---- */
.terms{display:flex;flex-direction:column;margin-bottom:4px}
.term{display:grid;grid-template-columns:1fr auto;gap:5px 8px;align-items:center;
  padding:12px 0;border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.term .tn{grid-column:1;font-family:var(--disp);font-weight:700;font-size:14.5px}
.term .chip{grid-column:2;justify-self:end}
.term .tp{grid-column:1 / -1;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.term .acts{grid-column:1 / -1;display:flex;gap:8px;margin-top:3px}
.term.now .tn{color:var(--accent)}

.formrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin-top:16px;padding-top:16px;border-top:2px solid var(--line)}
.formrow select,.formrow input[type="date"]{
  padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;
  background:var(--surface);font-size:14px;flex:1;min-width:9em;
}
.formrow select:focus,.formrow input:focus{outline:none;border-color:var(--accent)}
.formrow label{font-size:11.5px;color:var(--muted);width:100%;margin-bottom:-4px}

/* ---- 帳票の出力(独立した画面) ---- */
/* 帳票そのものに幅を回したいので、枠の内側は詰める */
#viewExport .card-bd{padding:12px}
@media (max-width:640px){ #viewExport .card-bd{padding:8px} }
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.range input[type="date"]{
  flex:1;min-width:8.5em;padding:9px 11px;border:1.5px solid var(--line-strong);
  border-radius:9px;background:var(--surface);font-size:14px;
}
.range input:focus{outline:none;border-color:var(--accent)}
.range .tilde{color:var(--muted);font-size:13px}

.pvwrap{
  background:#fff;color:#111614;border:1px solid var(--line);border-radius:8px;
  padding:10px;overflow-x:auto;margin-bottom:6px;
  width:fit-content;max-width:100%;margin-left:auto;margin-right:auto;
}
/* シートの実寸で描く。画面に収まらないときは縮めて全体を見せる
   (拡大はしない。実寸より大きいと、刷ったときの印象とずれるため) */
.pvwrap table.pv{margin:0 auto;transform-origin:top left}
.pvwrap.fit{overflow-x:hidden}
.pvwrap.fit table.pv{margin:0}
.pvscale{font-size:11px;color:var(--muted);margin:0 0 12px}
.pvscale:empty{display:none}
/* ============================================================
   出力の進み具合(画面下に固定)
   長い出力では画面を見ていられないので、スクロールしても
   画面を移動しても、いつでも残り時間が見えるようにする。
   ============================================================ */
.jobbar[hidden]{display:none}
.jobbar{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-top:1px solid var(--line);
  box-shadow:0 -6px 20px -10px rgba(22,33,29,.35);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.jb-in{
  max-width:1200px;margin:0 auto;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.jb-main{flex:1;min-width:240px}
.jb-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.jb-head b{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--ink-2)}
.jb-head span{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.jb-bar{
  height:8px;background:var(--surface-2);border-radius:999px;
  overflow:hidden;margin:6px 0 5px;
}
.jb-bar i{
  display:block;height:100%;background:var(--accent);width:0;
  transition:width .3s ease;
}
.jb-time{
  font-size:11.5px;color:var(--muted);line-height:1.6;
  font-variant-numeric:tabular-nums;
}
.jb-time b{color:var(--ink-2);font-weight:700}
.jb-act{display:flex;gap:8px;flex:0 0 auto}
.jb-act .btn{margin-top:0}

/* 終わったとき・失敗したとき */
.jobbar.done{border-top-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.jobbar.done .jb-head b{color:var(--ok)}
.jobbar.err{border-top-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.jobbar.err .jb-head b{color:var(--crit)}
.jobbar a{color:var(--accent);font-weight:700}

/* 帯のぶんだけ本文を持ち上げ、通知バーもぶつからない位置へ */
body.jobbar-on{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.jobbar-on .toast{bottom:calc(104px + env(safe-area-inset-bottom))}

@media (max-width:520px){
  .jb-act{width:100%}
  .jb-act .btn{flex:1}
}
/* 書体は帳票(スプレッドシート)側に合わせる。
   画面のプレビューと刷り上がりの印象をそろえるため、
   ここだけは画面用の書体を使わない */
table.pv{
  border-collapse:collapse;table-layout:fixed;font-size:10px;
  font-family:Arial,"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-variant-numeric:tabular-nums;
}
table.pv th,table.pv td{border:1px solid #2b3330;padding:2px 4px;vertical-align:middle}
table.pv th{background:#f4f6f5;font-size:8.5px;text-align:center;
  font-weight:700;line-height:1.3}
table.pv th.subhd{font-weight:400;font-size:7.5px;color:#3d4a45}
table.pv td.dt{text-align:center;line-height:1.35;font-size:8.5px}
table.pv td.dt b{display:block;font-size:10px}
table.pv td.n{text-align:right;font-size:10.5px}
table.pv td.u{text-align:left;font-size:7.5px;color:#3d4a45}
table.pv td.e{text-align:right;font-size:9.5px;white-space:nowrap}
table.pv td.e.ng{color:#c42a26;font-weight:700}
table.pv td.nt{font-size:8px;line-height:1.4;height:22px;color:#111614}
table.pv td.st{text-align:center;padding:1px}
table.pv td.st img{width:24px;height:24px;display:block;margin:0 auto}
table.pv td.st span{font-size:6.5px;color:#3d4a45;display:block}
.pvnote{font-size:11px;color:var(--muted);margin:0 0 14px}

.progress{margin:14px 0 4px}
.progress .bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;
  transition:width .25s ease}
.progress .txt{font-size:12px;color:var(--muted);margin-top:7px;
  font-variant-numeric:tabular-nums}
.donebox{
  background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);
  border-radius:10px;padding:12px 14px;margin-top:14px;
}
.donebox b{display:block;font-family:var(--disp);color:var(--ok);font-size:14px;margin-bottom:4px}
.donebox a{color:var(--accent);font-weight:700;font-size:13px}

/* ---- 変更履歴 ---- */
.logline{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.logline:first-child{border-top:0}
.logline time{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  flex:0 0 5.6em;line-height:1.7}
.logline .lt{flex:1;min-width:0}
.logline .lt b{font-family:var(--disp);font-size:12.5px;display:block}
.logline .lt span{color:var(--muted);font-size:11.5px}
.logempty{color:var(--muted);font-size:12.5px;padding:8px 0}

/* ---- 押印欄の「その日の管理薬剤師」 ---- */
.seal .pending{color:var(--muted);font-weight:500;font-family:var(--body);font-size:12px}
.seal .proxy{display:block;font-size:9.5px;color:var(--warn);font-family:var(--body);
  font-weight:600;margin-top:1px}

.note-block{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px;
}
.note-block b{display:block;color:var(--ink-2);font-family:var(--disp);
  font-size:12.5px;margin-bottom:3px}

/* ============================================================
   記録簿ビュー(監査用)
   1か月ぶんを、帳票と同じ書式で週ごとに続けて表示する。
   立入検査でそのまま見せられるよう、操作用の部品は最小限にしてある。
   ============================================================ */
.lgview[hidden]{display:none}
.lgview{max-width:1200px;margin:0 auto;padding:0 14px 60px}

.lg-bar{
  position:sticky;top:0;z-index:25;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:0 -14px 14px;padding:10px 14px;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(8px);
  border-bottom:1px solid var(--line);
}
.lg-bar .ttl{display:flex;flex-direction:column;line-height:1.25;margin-right:4px;min-width:0}
.lg-bar .ttl b{font-family:var(--disp);font-weight:700;font-size:15px;white-space:nowrap}
.lg-bar .ttl span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.lg-bar .sp{flex:1}
.lg-month{
  font-family:var(--mono);font-size:14px;font-weight:600;
  min-width:7.2em;text-align:center;font-variant-numeric:tabular-nums;
}
.lg-dirtycnt{font-size:11.5px;font-weight:700;color:var(--warn)}
.lg-dirtycnt:empty{display:none}

/* 編集中は画面全体の見た目を変える。監査中に気づかず触ってしまう事故を防ぐため */
.lgview.editing .lg-bar{
  background:var(--warn-soft);
  border-bottom-color:color-mix(in srgb,var(--warn) 45%,transparent);
}
.lgview.editing .lg-sheet{outline:2px solid var(--warn);outline-offset:2px}

.lg-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lg-stat{
  flex:1;min-width:104px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;box-shadow:var(--shadow);
}
.lg-stat .k{font-size:10.5px;letter-spacing:.08em;color:var(--muted);display:block}
.lg-stat .v{
  font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.35;
  font-variant-numeric:tabular-nums;
}
.lg-stat.ok   .v{color:var(--ok)}
.lg-stat.warn .v{color:var(--warn)}
.lg-stat.crit .v{color:var(--crit)}

.lg-alerts[hidden]{display:none}
.lg-alerts{
  background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  border-radius:10px;padding:10px 13px;margin-bottom:14px;font-size:12px;line-height:1.7;
}
.lg-alerts b{display:block;font-family:var(--disp);color:var(--warn);font-size:12.5px;margin-bottom:3px}
.lg-alerts .algrp{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}

.lg-week{margin-bottom:20px}
.lg-week > h3{
  font-family:var(--disp);font-size:12px;font-weight:700;margin:0 0 6px;
  color:var(--muted);letter-spacing:.06em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.lg-week > h3 .pg{font-family:var(--mono);font-size:10.5px;font-weight:500}
.lg-week > h3 .pg.right{margin-left:auto}

/* 帳票は 1071px と幅が決まっている。枠を画面いっぱいに広げると
   右側に大きな余白ができるので、中身に合わせて中央に置く */
.lg-week{width:fit-content;max-width:100%;margin-left:auto;margin-right:auto}

/* 帳票そのもの。画面の1枚 = 印刷の1ページ */
.lg-sheet{
  background:#fff;color:#111614;border:1px solid var(--line);border-radius:8px;
  padding:10px;overflow-x:auto;box-shadow:var(--shadow);
}

/* 行の状態。監査で聞かれる「抜けはないか」が一目で分かるようにする */
table.pv tr.lg-out  td{background:#fafbfa;color:#a6b0ac}   /* 当月外(前後の月) */
table.pv tr.lg-fut  td{background:#fafbfa}                  /* まだ来ていない日 */
table.pv tr.lg-miss td.dt{background:#fbeed8}               /* 未記録 */
table.pv tr.lg-appr td.dt{background:#e7f2ea}               /* 承認済み */
table.pv tr.lg-dirty td{background:#fff6dd}                 /* 未保存 */
table.pv tr.lg-saving td{opacity:.5}

table.pv td.dt .rowact{display:flex;gap:3px;justify-content:center;margin-top:3px}
table.pv td.dt .rowact:empty{display:none}
.rowbtn{
  border:1px solid #b9c4bf;background:#fff;border-radius:5px;
  padding:1px 6px;font-size:9px;font-weight:700;cursor:pointer;
  font-family:var(--body);color:#41514b;line-height:1.6;
}
.rowbtn:hover{border-color:#0f766e;color:#0f766e}
.rowbtn.go{background:#0f766e;border-color:#0f766e;color:#fff}

/* 編集中のセル */
table.pv td.ed{padding:0;background:#fffdf3}
table.pv td.ed input{
  width:100%;border:0;background:transparent;padding:3px 4px;
  font-family:inherit;font-size:10.5px;text-align:right;color:#111614;
}
table.pv td.ed input:focus{outline:2px solid #0f766e;outline-offset:-2px;background:#fff}
table.pv td.nt.ed{padding:1px}
.notebtn{
  width:100%;text-align:left;border:1px dashed #b9c4bf;border-radius:4px;background:#fff;
  font-family:var(--body);font-size:8.5px;line-height:1.5;color:#111614;
  padding:3px 5px;cursor:pointer;min-height:20px;
}
.notebtn:hover{border-color:#0f766e;color:#0f766e}
table.pv td.st.ed{padding:1px}
.stsel{
  width:100%;border:1px solid #b9c4bf;border-radius:4px;background:#fff;
  font-family:var(--body);font-size:9px;padding:2px 3px;color:#111614;
}
.stsel:focus{outline:2px solid #0f766e;outline-offset:-2px}

/* 未承認の目印。印刷には出さない(帳票の書式を崩さないため) */
table.pv td.st i.pend{
  display:block;font-style:normal;font-size:6px;color:#b45309;font-weight:700;
}

.lg-note{

  padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px;
}
.lg-note b{display:block;color:var(--ink-2);font-family:var(--disp);font-size:12.5px;margin-bottom:3px}

/* ============================================================
   印刷
   画面に出ている帳票を、そのまま紙に落とします。
   サーバーを介さないので待ち時間がありません。
   ドライブにPDFを残したいときは「PDFを出力」を使ってください。
   ============================================================ */
@media print{
  /* 画面のための部品は紙に出さない */
  .topbar,.lg-bar,.lg-stats,.lg-alerts,.lg-note,.cols,.overlay,.toast,
  #boot,#demoBar,.footnote,.presets,.range,.pvnote,.pvscale,
  .progress,.donebox,.actions,.jobbar{display:none !important}
  body.jobbar-on{padding-bottom:0}

  body{background:#fff;padding:0}
  .shell{padding:0;margin:0}
  .lgview{max-width:none;padding:0;margin:0}
  .card{border:0;box-shadow:none;background:#fff}
  #viewExport .card-bd{padding:0}

  /* 1週 = 1ページ */
  .lg-week{page-break-after:always;break-after:page;margin:0;width:auto;max-width:none}
  .lg-week:last-child{page-break-after:auto;break-after:auto}
  .lg-week > h3{display:none}
  .lg-sheet,.pvwrap{
    border:0;box-shadow:none;padding:0;overflow:visible;outline:0 !important;
    width:auto;max-width:none;height:auto !important;margin:0;
  }

  /* 罫線と見出しの地色。既定では背景が落ちるので、出すよう指定する。
     倍率は beforeprint で実測した値(--pscale)を当てる */
  table.pv{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    transform:scale(var(--pscale,1));transform-origin:top left;margin:0;
  }
  table.pv th{background:#f4f6f5 !important}
  table.pv td.e.ng{color:#c42a26 !important}

  /* 画面でしか使わない色分けは紙に出さない(帳票の見た目を崩さないため) */
  table.pv tr.lg-out td,table.pv tr.lg-fut td,table.pv tr.lg-dirty td,
  table.pv tr.lg-miss td.dt,table.pv tr.lg-appr td.dt,
  table.pv td.ed{background:transparent !important}
  table.pv tr.lg-saving td{opacity:1}
  table.pv td.st i.pend,table.pv td.dt .rowact{display:none !important}

  /* 編集中でも、紙には値だけが出るようにする */
  table.pv td.ed{padding:2px 4px}
  table.pv td.ed input,.stsel,.notebtn{
    border:0 !important;background:transparent !important;
    -webkit-appearance:none;appearance:none;box-shadow:none !important;
  }
  .notebtn{padding:0 !important;font-size:8px;color:#111614 !important}
  .notebtn.empty{visibility:hidden}   /* 「＋ 譲渡・譲受を記入」は紙に出さない */

  /* 外枠。PDF出力側も太くしてあるので、刷り比べたときに揃うようにする */
  table.pv{border:2px solid #2b3330}

  /* @page(用紙・向き・余白)は applyPaper_ が作ります。
     サーバーの CFG.PDF が唯一の出どころで、PDF出力と同じ値を使います。 */
}
</style>

     帳票の出力
     期間を選び、帳票テンプレート経由でPDFにする画面。

<div class="jobbar" id="jobBar" hidden role="status" aria-live="polite">

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   入力項目の定義。サーバー側(DBシートの列)と1対1で対応させる。
   ============================================================ */
var FIELDS = [
  // ―― 業務量 ――
  { key:'rx',        label:'処方箋枚数',   unit:'枚', step:'1',   min:0,  max:999, decimals:0,
    group:'業務量' },
  { key:'inquiry',   label:'疑義照会',     unit:'件', step:'1',   min:0,  max:99,  decimals:0,
    group:'業務量' },

  // ―― 温湿度(帳票の「調剤室 温度/湿度」「冷所 温度/湿度」に対応) ――
  { key:'roomTemp',  label:'調剤室 温度',  unit:'℃', step:'0.1', min:-10, max:50,  decimals:1,
    group:'温湿度', range:[1,30],
    alarm:'室温の管理基準 1〜30℃ を外れています。' },
  { key:'roomHumid', label:'調剤室 湿度',  unit:'%',  step:'1',   min:0,   max:100, decimals:0,
    group:'温湿度', range:[30,70],
    alarm:'管理基準 30〜70% を外れています。' },
  { key:'coldTemp',  label:'冷所 温度',    unit:'℃', step:'0.1', min:-10, max:30,  decimals:1,
    group:'温湿度', range:[2,8],
    alarm:'冷所の管理基準 2〜8℃ を外れています。庫内の医薬品を確認してください。' },
  { key:'coldHumid', label:'冷所 湿度',    unit:'%',  step:'1',   min:0,   max:100, decimals:0,
    group:'温湿度' }
];

/* 帳票の「管理に関する事項」欄。譲渡・譲受があった日だけ記入します。
   サブ見出しの並び(譲渡区分/譲渡先名/販売メーカー名称/医薬品名称/
   包装形態/譲渡数/Lot/使用期限)と順番を合わせてあります。 */
var XFER = [
  { key:'xKind',    label:'譲渡区分',           type:'select', choices:['譲渡','譲受'] },
  { key:'xPartner', label:'譲渡先名 / 譲受元名', type:'text' },
  { key:'xMaker',   label:'販売メーカー名称',    type:'text' },
  { key:'xDrug',    label:'医薬品名称',          type:'text', wide:true },
  { key:'xPack',    label:'包装形態',           type:'text' },
  { key:'xQty',     label:'譲渡数',             type:'text' },
  { key:'xLot',     label:'Lot',                type:'text' },
  { key:'xExpiry',  label:'使用期限',           type:'month' }
];

var IS_GAS = (typeof google !== 'undefined' && google.script && google.script.run);
var S = { week:null, sel:null, me:null, staff:[], isAdmin:false, dirty:false,
          todayDay:null, navBusy:false, missSpan:30 };

/* ---------- サーバー呼び出し(GASでもプレビューでも同じ形で使う) ---------- */
function call(fn, args, ok, ng){
  if (IS_GAS){
    google.script.run.withSuccessHandler(ok).withFailureHandler(ng || fail)[fn].apply(null, args||[]);
  } else {
    setTimeout(function(){ try{ ok(MOCK[fn].apply(null, args||[])); }catch(e){ (ng||fail)(e); } }, 180);
  }
}
function fail(e){ toast((e && e.message) || 'サーバーとの通信に失敗しました', true); }

/* ============================================================
   画面の切り替え
   トップバーの丸ボタンで「入力 / 記録簿 / 出力」を行き来します。
   3つとも同時に出すと縦に長くなり、監査で見せるときにも邪魔なので、
   選んだ画面だけを表示します。書きかけがあるときは確認を挟みます。
   ============================================================ */
var VIEWS = {
  input:  { el:'main',       btn:'navInput'  },
  ledger: { el:'ledger',     btn:'navLedger' },
  export: { el:'viewExport', btn:'navExport' }
};
var VIEW = '';

function showView(name){
  if (name === VIEW) return;
  if (!canLeaveView_(VIEW)) return;
  setView_(name);
}

function setView_(name){
  var prev = VIEW;
  VIEW = name;
  Object.keys(VIEWS).forEach(function(k){
    document.getElementById(VIEWS[k].el).hidden = (k !== name);
    document.getElementById(VIEWS[k].btn)
      .setAttribute('aria-pressed', k === name ? 'true' : 'false');
  });
  window.scrollTo(0, 0);
  enterView_(name, prev);
}

/** その画面を離れてよいか。書きかけや処理中のときだけ止めます */
function canLeaveView_(name){
  if (name === 'input' && S.dirty){
    if (!confirm('入力中の内容が保存されていません。画面を移動しますか？')) return false;
    S.dirty = false;
    S.editing = false;
    release_(S.sel);
  }
  if (name === 'ledger'){
    if (LG.busy){ toast('保存中です。少しお待ちください', true); return false; }
    if (lgDirtyCount() &&
        !confirm('記録簿に保存していない行が ' + lgDirtyCount() + ' 件あります。\n破棄して移動しますか？')){
      return false;
    }
    LG.dirty = {};
    LG.edit = false;
  }
  // 出力中でも移動してかまいません。進み具合は画面下の帯に出続けます
  return true;
}

function enterView_(name, prev){
  if (name === 'input'){
    // 記録簿で直した内容を取り込む。起動直後(prev なし)は boot が済ませている
    if (prev && S.week){
      call('getWeekState', [S.sel || null],
        function(d){ apply(d); refreshMissing(); }, function(){});
    }
  } else if (name === 'ledger'){
    lgOpen();
  } else if (name === 'export'){
    openPrint();
  }
  lgBar();
}

/* ---------- 起動 ---------- */
function boot(){
  if (!IS_GAS) document.getElementById('demoBar').hidden = false;
  call('getWeekState', [null], function(d){
    S.staff = d.staff;                       // [{id,name,active,records}]
    S.terms = d.terms || [];                 // [{id,staffId,name,from}] 管理薬剤師の任期
    S.auth = d.auth || { mode:'select' };
    applyPaper_(d.paper);        // 用紙・向き・余白をサーバーに合わせる
    EXPORT.secPerWeek = (d.exportRate && d.exportRate.secPerWeek) || 0;
    S.me = decideMe(d);
    document.getElementById('brandName').textContent = d.store;
    renderIdentity();
    apply(d);
    document.getElementById('boot').hidden = true;
    setView_('input');
    scanMissing();
  });
}

/* ---------- 名簿の小道具 ---------- */
function activeStaff(){
  return S.staff.filter(function(s){ return s.active; });
}
function staffByName(n){
  var f = S.staff.filter(function(s){ return s.name === n; });
  return f.length ? f[0] : null;
}
/* ---------- 管理薬剤師(任期テーブルから引く) ----------
   管理薬剤師は各時点で1名。任期は開始日だけを持ち、
   終了日は「次の任期の前日」として導出する。
   こうしておけば、日付を直しても期間が食い違わない。 */
function adminOn(dateStr){
  var hit = null;
  (S.terms || []).forEach(function(t){
    if (t.from <= dateStr && (!hit || t.from > hit.from)) hit = t;
  });
  return hit ? hit.name : '';
}
function currentAdminName(){ return adminOn(S.week ? S.week.today : '9999-12-31'); }

/* 承認できるのは、その日の管理薬剤師か、現任の管理薬剤師(代行) */
function canApprove(dateStr){
  if (!S.me) return false;
  return S.me === adminOn(dateStr) || S.me === currentAdminName();
}

/* 誰として記録するかを決める。
   select … 名簿から選ぶ(共用端末向け。既定)
   google … Googleアカウントで確定(本人が選び直せないので押印の根拠が強い) */
/* 共用端末で開くので、前の人の名前が残っていると
   そのまま別人の名前で押印・ロックしてしまう。
   だから select のときは必ず空欄から始める。 */
function decideMe(d){
  if (S.auth.mode === 'google') return S.auth.registered ? S.auth.name : '';
  return '';
}

/* 名簿にないGoogleアカウントは記録させない。ここを緩めると押印が意味を失う */
function isBlocked(){ return S.auth.mode === 'google' && !S.auth.registered; }

function apply(d){
  S.week = d;
  // 過去の週を見ているあいだも「本日の状態」は today のまま出したいので、
  // 今日を含む週を読んだときだけ控えを取っておく
  if (weekHas(d.today)) S.todayDay = dayOf(d.today);
  if (!S.sel || !weekHas(S.sel)) S.sel = defaultSel(d);
  renderToday();
  renderWeek();
  renderForm();
}

/** いま表示している週にその日が入っているか */
function weekHas(dateStr){
  if (!S.week) return false;
  return S.week.days.some(function(d){ return d.date === dateStr; });
}

/** 週を開いたときに最初に選ぶ日
 *  今週なら今日。過去の週なら、いちばん手前の未入力の日(なければ最終日) */
function defaultSel(d){
  var past = d.days.filter(function(x){ return x.date <= d.today; });
  if (!past.length) return d.days[0].date;
  for (var i=0;i<past.length;i++) if (past[i].date === d.today) return d.today;
  for (var j=0;j<past.length;j++) if (past[j].state === 'empty') return past[j].date;
  return past[past.length-1].date;
}

/* ---------- 担当者の表示 ---------- */
function renderIdentity(){

  if (S.auth.mode === 'google'){

    box.className = 'who signed' + (known ? '' : ' unknown');
    box.innerHTML = '<span class="nm">' + esc(known ? S.auth.name : '名簿にありません') + '</span>'
                  + '<span class="em">' + esc(S.auth.email) + '</span>';

  box.className = 'who' + (S.me ? '' : ' need');
  box.innerHTML = '<label for="me">担当</label><select id="me"></select>';

    + activeStaff().map(function(s){
        return '<option'+(s.name===S.me?' selected':'')+'>'+esc(s.name)+'</option>';
      }).join('');
  sel.value = S.me || '';
  sel.addEventListener('change', function(){

    if (S.me && S.dirty) claimOnce_();

}

/* ---------- 本日カード ---------- */
function renderToday(){
  var d = S.todayDay || dayOf(S.week.today);
  var card = document.getElementById('todayCard');
  document.getElementById('tMd').textContent  = d.date.slice(5).replace('-','/');
  document.getElementById('tDow').textContent = d.dow;

  var sub   = document.getElementById('tSub');

  }
}

/* ---------- 週の移動 ----------
   週の始まりの決め方はサーバー(CFG.WEEK_START)に任せてある。
   画面は「その日を含む週」を頼むか、いまの週から±7日ずらすだけ。 */
function gotoWeek(anchor, wantSel){
  if (S.navBusy) return;
  if (S.dirty && !confirm('入力中の内容が保存されていません。移動しますか？')) return;
  S.dirty = false;
  S.editing = false;
  release_(S.sel);
  S.navBusy = true;
  setNavDisabled(true);
  call('getWeekState', [anchor || null], function(d){
    S.navBusy = false;
    S.sel = (wantSel && d.days.some(function(x){ return x.date === wantSel; })) ? wantSel : null;
    apply(d);
  }, function(e){
    S.navBusy = false; setNavDisabled(false); fail(e);
  });
}

/** その日へ移動する。同じ週の中なら読み直さない */
function gotoDate(dateStr){
  if (weekHas(dateStr)){ selectDay(dateStr); return; }
  gotoWeek(dateStr, dateStr);
}

function selectDay(dateStr){
  if (dateStr === S.sel) return;
  if (S.dirty && !confirm('入力中の内容が保存されていません。移動しますか？')) return;
  S.dirty = false;
  S.editing = false;
  release_(S.sel);
  S.sel = dateStr;
  renderWeek(); renderForm();
}

function setNavDisabled(on){
  ['wkPrev','wkNext','wkNow','wkJump'].forEach(function(id){
    document.getElementById(id).disabled = on;
  });
}

/** iso から今日までの日数 */
function weeksAgoOf(startIso, todayIso){
  var a = startIso.split('-'), b = todayIso.split('-');
  var d1 = new Date(+a[0], +a[1]-1, +a[2]), d2 = new Date(+b[0], +b[1]-1, +b[2]);
  return Math.floor(Math.round((d2 - d1) / 86400000) / 7);
}

/* ---------- 週の一覧 ---------- */
function renderWeek(){
  var w = S.week;
  var isNow = weekHas(w.today);

  document.getElementById('weekTitle').textContent = isNow ? '今週' : '過去の週';
  document.getElementById('weekRange').textContent =
    w.days[0].date.replace(/-/g,'/') + ' – ' + w.days[6].date.slice(5).replace('-','/');

  setNavDisabled(false);
  document.getElementById('wkNext').disabled = isNow;
  document.getElementById('wkNow').disabled = isNow;   // 今週を見ているときは押す必要がない
  document.getElementById('wkNow').setAttribute('aria-current', isNow ? 'true' : 'false');

  var jump = document.getElementById('wkJump');
  jump.max = w.today;
  jump.value = (S.sel && S.sel <= w.today) ? S.sel : w.days[0].date;

  var bar = document.getElementById('pastBar');
  bar.hidden = isNow;
  if (!isNow){
    var n = weeksAgoOf(w.days[0].date, w.today);
    document.getElementById('pastMsg').textContent =
      n + '週間前の記録です。入力し忘れた日はここから入れられます。';
  }

  document.getElementById('week').innerHTML = w.days.map(function(d){
    var future = d.date > w.today;
    return '<button class="day" data-date="'+d.date+'"'
      + (d.date === S.sel ? ' aria-current="true"' : '')
      + (future ? ' disabled' : '') + '>'
      + '<span class="d-date">'+d.date.slice(8)+'<span class="dw">'+d.dow+'</span></span>'
      + '<span class="d-vals">'+valSummary(d, future)+'</span>'
      + stateChip(d, future)
      + '</button>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('.day'), function(el){
    el.addEventListener('click', function(){ selectDay(el.getAttribute('data-date')); });
  });
}

function valSummary(d, future){
  if (future) return '';
  if (d.state === 'empty' || d.state === 'editing') return '';
  var cls = function(key){
    var f = FIELDS.filter(function(x){ return x.key === key; })[0];
    if (!f || !f.range || d[key] === null) return '';
    return (d[key] < f.range[0] || d[key] > f.range[1]) ? 'bad' : '';
  };
  return '<b>' + d.rx + '枚</b> · <b>' + d.inquiry + '件</b> · '
       + '室<b class="' + cls('roomTemp') + '">' + fmt(d.roomTemp,1) + '</b>/'
       + '<b class="' + cls('roomHumid') + '">' + fmt(d.roomHumid,0) + '</b> · '
       + '冷<b class="' + cls('coldTemp') + '">' + fmt(d.coldTemp,1) + '</b>/'
       + '<b class="' + cls('coldHumid') + '">' + fmt(d.coldHumid,0) + '</b>'
       + (d.xDrug ? ' · <b>譲渡</b>' : '');
}

function stateChip(d, future){
  if (future)                  return '<span class="chip off">—</span>';
  if (d.state === 'approved')  return '<span class="chip appr">承認済</span>';
  if (d.state === 'saved')     return '<span class="chip done">入力済</span>';
  if (d.state === 'editing')   return '<span class="chip lock">入力中</span>';
  return '<span class="chip todo">未入力</span>';
}

/* ---------- 入力フォーム ---------- */
function renderForm(){
  var d = dayOf(S.sel);
  var blocked = isBlocked();
  var locked = (d.state === 'editing' && d.lockedBy !== S.me);
  var saved  = (d.state === 'saved' || d.state === 'approved');
  var ro     = blocked || locked || (saved && !S.editing);

  document.getElementById('blockArea').innerHTML = blocked
    ? '<div class="blockmsg"><div><b>このアカウントでは記録できません</b>'
      + esc(S.auth.email) + ' は担当者名簿に登録されていません。'
      + '管理者に登録を依頼するか、勤務用のアカウントで開き直してください。</div></div>'
    : '';

  document.getElementById('formTitle').textContent =
    d.date.slice(5).replace('-','/') + '(' + d.dow + ')の記録';
  document.getElementById('formState').innerHTML = stateChip(d, false);

  // 数値欄。グループ見出しを挟みながら並べる
  var lastGroup = '';
  document.getElementById('fields').innerHTML = FIELDS.map(function(f){
    var head = (f.group && f.group !== lastGroup)
      ? '<div class="grouphd">' + esc(f.group) + '</div>' : '';
    lastGroup = f.group || lastGroup;
    var v = (d[f.key] === null || d[f.key] === undefined) ? '' : d[f.key];
    return head
      + '<div class="field" data-key="'+f.key+'">'
      + '<label for="in_'+f.key+'">'+esc(f.label)+'</label>'
      + '<div class="inputwrap">'
      +   '<input id="in_'+f.key+'" type="number" inputmode="'
      +   (f.decimals ? 'decimal' : 'numeric')+'" step="'+f.step+'" min="'+f.min+'" max="'+f.max+'"'
      +   ' value="'+v+'"'+(ro ? ' disabled' : '')+'>'
      +   '<span class="unit">'+f.unit+'</span>'
      + '</div>'
      + (f.range ? '<div class="alarm">'+esc(f.alarm||'')+'</div>' : '')
      + '</div>';
  }).join('');

  FIELDS.forEach(function(f){
    var el = document.getElementById('in_'+f.key);
    el.addEventListener('input', function(){
      S.dirty = true; checkRange(f);
      if (!S.me) needStaff(false); else claimOnce_();
    });
    checkRange(f);
  });

  renderXfer_(d, ro);

  // 押印欄。管理者印は、その日の管理薬剤師が誰だったかを常に示す
  seal('sealStaff', d.staff, d.savedAt);
  sealAdmin_(d);

  // ボタン
  var save = document.getElementById('btnSave');
  var edit = document.getElementById('btnEdit');
  var appr = document.getElementById('btnApprove');

  save.hidden = ro;
  save.textContent = saved ? '上書き保存' : '保存する';
  save.disabled = false;
  edit.hidden = !(saved && !S.editing) || locked || blocked;
  appr.hidden = !(canApprove(d.date) && d.state === 'saved') || blocked;

  if (locked || blocked){ save.hidden = true; edit.hidden = true; }
}

/* 名簿から印影画像を引く */
function sealUrlOf(name){
  var s = staffByName(name);
  return (s && s.sealUrl) ? s.sealUrl : '';
}
function stampImg_(name){
  var u = sealUrlOf(name);
  return u ? '<img class="stamp" src="' + u + '" alt="' + esc(name) + ' の印">' : '';
}

/* 入力を始めた時点で「入力中」を立て、他の人に見えるようにする。
   応答で画面を作り直すとフォーカスが外れるので、投げっぱなしにする。 */
/* ---------- 担当者が未選択のときの促し ----------
   ここが空のまま入力を始めると、誰の名前で押印するか決まらない。
   勝手に先頭の人を選んでしまうと、その人の名前でロックがかかって
   あとから外せずに困るので、必ず本人に選ばせる。 */
var pickTimer;
function needStaff(focus){
  if (S.auth.mode === 'google') return;      // アカウントで確定しているときは出さない
  var box = document.getElementById('who');
  var pop = document.getElementById('pickMe');
  box.classList.remove('need');
  void box.offsetWidth;                      // アニメーションを鳴らし直す
  box.classList.add('need');
  pop.hidden = false;
  clearTimeout(pickTimer);
  pickTimer = setTimeout(clearNeedStaff, 7000);
  if (focus){
    var sel = document.getElementById('me');
    if (sel) sel.focus();
  }
}
function clearNeedStaff(){
  clearTimeout(pickTimer);
  document.getElementById('pickMe').hidden = true;
  document.getElementById('who').classList.remove('need');
}

function claimOnce_(){
  var d = dayOf(S.sel);
  if (S.claimed === S.sel || d.state !== 'empty' || !S.me) return;
  S.claimed = S.sel;
  call('claimDay', [{ date:S.sel, staff:S.me }], function(){}, function(){});
}
function release_(date){
  if (S.claimed !== date || !S.me) return;
  S.claimed = null;
  call('releaseDay', [{ date:date, staff:S.me }], function(){}, function(){});
}

/* 管理に関する事項(譲渡記録)。
   譲渡があった日だけ書く欄なので、既定は閉じておき、
   「記載あり」を押したときだけ入力欄を出します。 */
function renderXfer_(d, ro){
  var has = XFER.some(function(f){ return d[f.key]; });
  if (S.xferOpen === undefined || S.xferDate !== d.date){
    S.xferOpen = has;
    S.xferDate = d.date;
  }

  var body = XFER.map(function(f){
    var v = d[f.key] == null ? '' : String(d[f.key]);
    var input;
    if (f.type === 'select'){
      input = '<select id="in_'+f.key+'"'+(ro?' disabled':'')+'>'
            + '<option value=""></option>'
            + f.choices.map(function(c){
                return '<option'+(c===v?' selected':'')+'>'+esc(c)+'</option>'; }).join('')
            + '</select>';
    } else {
      input = '<div class="inputwrap"><input id="in_'+f.key+'" type="'
            + (f.type === 'month' ? 'month' : 'text') + '" value="'+esc(v)+'"'
            + (ro?' disabled':'') + '></div>';
    }
    return '<div class="field txt' + (f.wide ? ' wide' : '') + '">'
      + '<label for="in_'+f.key+'">'+esc(f.label)+'</label>' + input + '</div>';
  }).join('');

  document.getElementById('xfer').innerHTML =
      '<div class="xfer-hd">'
    +   '<h3>管理に関する事項</h3>'
    +   '<button class="toggle" id="xferToggle" aria-pressed="'+(S.xferOpen?'true':'false')+'"'
    +     (ro?' disabled':'') + '>' + (S.xferOpen ? '記載あり' : '記載なし') + '</button>'
    +   '<div class="xfer-note">医薬品の譲渡・譲受があった日だけ記入します。'
    +     '入力した内容は帳票の「管理に関する事項」欄に1行にまとめて印字されます。</div>'
    + '</div>'
    + '<div class="xfer-body" id="xferBody"' + (S.xferOpen ? '' : ' hidden') + '>' + body + '</div>';

  var btn = document.getElementById('xferToggle');
  if (btn) btn.addEventListener('click', function(){
    S.xferOpen = !S.xferOpen;
    btn.setAttribute('aria-pressed', S.xferOpen ? 'true' : 'false');
    btn.textContent = S.xferOpen ? '記載あり' : '記載なし';
    document.getElementById('xferBody').hidden = !S.xferOpen;
    if (S.xferOpen) claimOnce_();
  });

  XFER.forEach(function(f){
    var el = document.getElementById('in_'+f.key);
    if (el) el.addEventListener('input', function(){
      S.dirty = true;
      if (!S.me) needStaff(false); else claimOnce_();
    });
  });
}

function seal(id, name, at){
  var el = document.getElementById(id);
  el.classList.toggle('filled', !!name);
  el.querySelector('.name').innerHTML = name ? (stampImg_(name) + esc(name)) : '—';
  el.querySelector('.at').textContent = at || '';
}

/* 管理者印。
   その日に在任している管理薬剤師の印影を、承認の有無にかかわらず毎日入れます。
   承認済みかどうかは、印影の下の一行で分けて示します(情報を落とさないため)。
   実際に承認した人がその日の管理薬剤師と違う場合は、代行として明示します。 */
function sealAdmin_(d){
  var el = document.getElementById('sealAdmin');
  var nameEl = el.querySelector('.name');
  var atEl = el.querySelector('.at');

  var chief = adminOn(d.date);            // その日の管理薬剤師 = 印影の持ち主
  var signer = d.admin || chief;          // 実際に承認した人(未承認なら管理薬剤師)

  if (!chief && !d.admin){
    el.classList.remove('filled');
    el.classList.remove('await');
    nameEl.innerHTML = '<span class="pending">管理薬剤師 未登録</span>';
    atEl.textContent = '';
    return;
  }

  el.classList.add('filled');
  el.classList.toggle('await', !d.admin);
  nameEl.innerHTML = stampImg_(chief || signer) + esc(chief || signer)
    + (d.admin && chief && d.admin !== chief
        ? '<span class="proxy">承認 ' + esc(d.admin) + '（代行）</span>' : '');
  atEl.textContent = d.admin ? (d.approvedAt || '承認済') : '承認待ち';
}

/* 入力欄の中身を控える／戻す。
   担当者を選び直したときにフォームを作り直すので、その前後で使う */
function formSnapshot_(){
  var snap = {};
  FIELDS.concat(XFER).forEach(function(f){
    var el = document.getElementById('in_' + f.key);
    if (el) snap[f.key] = el.value;
  });
  return snap;
}
function formRestore_(snap){
  if (!snap) return;
  Object.keys(snap).forEach(function(k){
    if (snap[k] === '') return;
    var el = document.getElementById('in_' + k);
    if (el && !el.disabled) el.value = snap[k];
  });
  FIELDS.forEach(function(f){
    if (document.getElementById('in_' + f.key)) checkRange(f);
  });
}

function checkRange(f){
  if (!f.range) return;
  var el = document.getElementById('in_'+f.key);
  var wrap = el.closest('.field');
  var v = parseFloat(el.value);
  wrap.classList.toggle('out-of-range', !isNaN(v) && (v < f.range[0] || v > f.range[1]));
}

/* ---------- 保存・承認 ---------- */
document.getElementById('btnSave').addEventListener('click', function(){
  if (!S.me){
    needStaff(true);
    toast('担当者を選んでから保存してください', true);
    return;
  }
  var payload = { date:S.sel, staff:S.me };
  var missing = [];
  var outOf = [];

  FIELDS.forEach(function(f){
    var el = document.getElementById('in_'+f.key);
    var v = el.value.trim();
    if (v === ''){ missing.push(f.label); return; }
    var n = parseFloat(v);
    if (isNaN(n) || n < f.min || n > f.max){ missing.push(f.label); return; }
    if (f.range && (n < f.range[0] || n > f.range[1])) outOf.push(f.label);
    payload[f.key] = n;
  });

  if (missing.length){ toast(missing.join('・') + ' を入力してください', true); return; }

  // 管理に関する事項。「記載あり」のときだけ送り、最低限の項目は必須にする
  XFER.forEach(function(f){ payload[f.key] = ''; });
  if (S.xferOpen){
    var lack = [];
    XFER.forEach(function(f){
      var el = document.getElementById('in_'+f.key);
      payload[f.key] = el ? String(el.value).trim() : '';
    });
    if (!payload.xKind) lack.push('譲渡区分');
    if (!payload.xDrug) lack.push('医薬品名称');
    if (lack.length){
      toast('管理に関する事項の ' + lack.join('・') + ' を入力してください', true);
      return;
    }
  }

  // 逸脱値も記録できなければ意味がないので、止めずに確認だけする
  if (outOf.length &&
      !confirm(outOf.join('・') + ' が管理基準を外れています。\nこの値のまま記録しますか？')){
    return;
  }

  var btn = this; btn.disabled = true; btn.textContent = '保存中…';
  call('saveDay', [payload], function(d){
    S.dirty = false; S.editing = false; S.claimed = null;
    apply(d);
    refreshMissing();
    toast('保存しました');
  }, function(e){
    btn.disabled = false; btn.textContent = '保存する';
    fail(e);
  });
});

document.getElementById('btnEdit').addEventListener('click', function(){
  S.editing = true; renderForm();
});

document.getElementById('btnApprove').addEventListener('click', function(){
  if (!S.me){ needStaff(true); toast('担当者を選んでください', true); return; }
  if (!confirm(S.sel + ' の記録を承認します。よろしいですか？')) return;
  call('approveDay', [{ date:S.sel, admin:S.me }], function(d){
    apply(d); toast('承認しました');
  });
});

document.getElementById('wkNext').addEventListener('click', function(){

/* ---------- 入力もれ ---------- */
document.getElementById('missScan').addEventListener('click', function(){ scanMissing(); });
document.getElementById('missSpan').addEventListener('change', function(){ scanMissing(); });

function scanMissing(){
  var span = Number(document.getElementById('missSpan').value) || 30;
  S.missSpan = span;
  var btn = document.getElementById('missScan');
  btn.disabled = true;
  call('findMissing', [span], function(r){
    btn.disabled = false; renderMissing(r);
  }, function(e){ btn.disabled = false; fail(e); });
}

/* 保存や承認のあと、一覧を静かに取り直す(件数がずれたままにならないように) */
function refreshMissing(){
  if (!S.missSpan) return;
  call('findMissing', [S.missSpan], function(r){ renderMissing(r); }, function(){});
}

function renderMissing(r){
  var note = document.getElementById('missNote');
  var list = document.getElementById('missList');
  note.textContent = '過去' + r.span + '日';

  if (!r.days.length){
    list.innerHTML = '<p class="missnone">この範囲に未入力の日はありません。</p>';
    return;
  }
  note.textContent = '過去' + r.span + '日で ' + r.days.length + ' 日';
  list.innerHTML = r.days.map(function(d){
    var lock = d.state === 'editing';

/* ---------------- 印影の登録 ----------------
   スキャンした印鑑は、たいてい白い余白つきで背景が不透明です。
   そのまま貼ると罫線が白い四角で隠れるので、
   ブラウザ側で「白を透過 → 余白を切り落とす → 正方形300pxに揃える」
   まで済ませてから保存します。全員分の見た目が揃うのが狙いです。 */

function sealBtn_(s){

      + '<span class="no">印</span>未登録</button>';
}

var SEAL = { id:null, src:null, threshold:210 };

function openSealEditor(id){

  if (!s) return;

  sheet('<div class="sealedit">'
    + '<h3>' + esc(s.name) + ' さんの印影</h3>'
    + '<p class="lead">スキャンした画像を選ぶと、白い背景を透過にして余白を切り落とし、'
    + '300px角に揃えて保存します。印刷用の記録簿には、この形で貼られます。</p>'
    + '<button class="filepick" id="pick">画像ファイルを選ぶ</button>'
    + '<input id="sealFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>'
    + '<div class="previews">'
    +   '<div class="pv"><span class="cap">元の画像</span>'
    +     '<div class="frame empty" id="pvBefore">未選択</div></div>'
    +   '<div class="pv"><span class="cap">保存される形</span>'
    +     '<div class="frame' + (s.sealUrl ? '' : ' empty') + '" id="pvAfter">'
    +       (s.sealUrl ? '<img src="' + s.sealUrl + '" alt="現在の印影">' : '未選択') + '</div></div>'
    + '</div>'
    + '<div class="slider" id="thWrap" hidden>'
    +   '<label>背景として抜く明るさ <span id="thVal">210</span></label>'
    +   '<input type="range" id="th" min="140" max="250" value="210">'
    + '</div>'
    + '<div class="actions">'
    +   '<button class="btn primary" id="sealSave" disabled>保存する</button>'
    +   '<button class="btn ghost" id="sealBack">戻る</button>'
    +   (s.sealUrl ? '<button class="btn ghost" id="sealDel">印影を削除</button>' : '')
    + '</div>'
    + '</div>');

  var file = document.getElementById('sealFile');
  document.getElementById('pick').addEventListener('click', function(){ file.click(); });
  file.addEventListener('change', function(){
    var f = file.files && file.files[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024){ toast('画像が大きすぎます(8MBまで)', true); return; }
    var r = new FileReader();
    r.onload = function(){ SEAL.src = r.result; loadSealPreview(); };
    r.readAsDataURL(f);
  });

  document.getElementById('th').addEventListener('input', function(){
    SEAL.threshold = parseInt(this.value, 10);
    document.getElementById('thVal').textContent = this.value;
    renderSealAfter();
  });

  document.getElementById('sealBack').addEventListener('click', function(){ renderSheet(); });
  document.getElementById('sealSave').addEventListener('click', function(){
    var url = document.getElementById('pvAfter').querySelector('canvas');

function loadSealPreview(){
  var img = new Image();
  img.onload = function(){
    SEAL.img = img;
    var b = document.getElementById('pvBefore');
    b.classList.remove('empty');
    b.innerHTML = '<img src="' + SEAL.src + '" alt="">';
    document.getElementById('thWrap').hidden = false;
    renderSealAfter();
  };
  img.onerror = function(){ toast('画像を読み込めませんでした', true); };
  img.src = SEAL.src;
}

function renderSealAfter(){
  if (!SEAL.img) return;
  var out = normalizeSeal(SEAL.img, SEAL.threshold);
  var a = document.getElementById('pvAfter');
  a.classList.remove('empty');
  a.innerHTML = '';
  a.appendChild(out);
  document.getElementById('sealSave').disabled = false;
}

/* 白背景を抜き、印影の外接矩形で切り出して 300px 角に収める */
function normalizeSeal(img, threshold){
  var W = img.naturalWidth, H = img.naturalHeight;
  var scale = Math.min(1, 900 / Math.max(W, H));      // 巨大なスキャンは先に縮める
  var w = Math.max(1, Math.round(W * scale));
  var h = Math.max(1, Math.round(H * scale));

  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);

  var d = ctx.getImageData(0, 0, w, h);
  var px = d.data;
  var minX = w, minY = h, maxX = -1, maxY = -1;

  for (var y = 0; y < h; y++){
    for (var x = 0; x < w; x++){
      var i = (y * w + x) * 4;
      var r = px[i], g = px[i+1], b = px[i+2];
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      // 明るくて色味の乏しい画素を背景とみなす(朱色は彩度が高いので残る)
      if (mn >= threshold && (mx - mn) < 45){
        px[i+3] = 0;
      } else if (px[i+3] > 24){
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  ctx.putImageData(d, 0, 0);

  if (maxX < 0){ minX = 0; minY = 0; maxX = w - 1; maxY = h - 1; }   // 全部抜けた場合の保険
  var cw = maxX - minX + 1, ch = maxY - minY + 1;
  var side = Math.max(cw, ch);
  var pad = Math.round(side * 0.04);
  side += pad * 2;

  var out = document.createElement('canvas');
  out.width = 300; out.height = 300;
  var octx = out.getContext('2d');
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(c,
    minX - (side - cw) / 2, minY - (side - ch) / 2, side, side,
    0, 0, 300, 300);
  return out;
}

/* ---------- 日付の小道具 ---------- */
function jp(iso){
  if (!iso) return '';
  var p = iso.split('-');
  return p[0] + '/' + p[1] + '/' + p[2];
}
function addDays(iso, n){
  var p = iso.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
       + '-' + String(d.getDate()).padStart(2,'0');
}
function daysSince(iso){
  var p = iso.split('-');
  var from = new Date(+p[0], +p[1]-1, +p[2]);
  var now = new Date(); now = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((now - from) / 86400000) + 1;
}

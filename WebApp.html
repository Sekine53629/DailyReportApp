/* 帳票は列幅の合計が1000pxを超えるので、画面によっては入りきりません。
   はみ出す分だけ縮めて、1週間の全体が一目で分かるようにします。
   縮めたときは、その倍率を下に出します(刷るのは常に原寸) */
function fitPreview_(){
  var wrap = document.getElementById('pvWrap');
  var note = document.getElementById('pvScale');
  if (!wrap) return;
  var tbl = wrap.querySelector('table.pv');
  if (!tbl) return;

  // いったん元に戻してから測る
  wrap.classList.remove('fit');
  wrap.style.height = '';
  tbl.style.transform = '';
  if (note) note.textContent = '';

  var avail = wrap.clientWidth - 20;      // .pvwrap の内側の余白ぶん
  var w = tbl.offsetWidth;
  if (!w || !avail || w <= avail) return; // 収まっているならそのまま

  var k = avail / w;
  tbl.style.transform = 'scale(' + k.toFixed(4) + ')';
  wrap.style.height = Math.ceil(tbl.offsetHeight * k) + 'px';
  wrap.classList.add('fit');
  if (note){
    note.textContent = '画面の幅に合わせて ' + Math.round(k * 100) + '% で表示しています。'
      + '印刷・PDFは原寸です。';
  }
}

window.addEventListener('resize', function(){
  if (VIEW === 'export') fitPreview_();
});

/* 印刷と出力の実装は「出力」の節にまとめてあります(下の方) */

function preset(label, key){
  return '<button class="mini" data-preset="' + key + '">' + label + '</button>';
}

function wirePrint_(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function(b){
    b.addEventListener('click', function(){
      applyPreset_(b.getAttribute('data-preset'));
      P.stale = false;      // 開始日と最終日が一度に決まるので、そのまま作り直す
      loadPreview();
    });
  });
  // 日付を選ぶたびに作り直すと、開始日を選んだ時点でも一度生成してしまう。
  // ここでは値を控えるだけにして、「表示」を押されたときに作り直す。
  ['pvFrom','pvTo'].forEach(function(id){
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', function(){
      P.from = document.getElementById('pvFrom').value;
      P.to   = document.getElementById('pvTo').value;
      if (P.from && P.to && P.from > P.to){
        P.to = P.from;
        document.getElementById('pvTo').value = P.to;
      }
      pvRangeChanged_();
    });
  });
  var show = document.getElementById('pvShow');
  if (show) show.addEventListener('click', function(){
    if (!P.from || !P.to){ toast('開始日と最終日を選んでください', true); return; }
    P.stale = false;
    loadPreview();
  });
  var paper = document.getElementById('pvPaper');
  if (paper) paper.addEventListener('click', function(){ printPaper_('export'); });
  var go = document.getElementById('pvGo');
  if (go) go.addEventListener('click', startPrint_);
}

/* 期間を変えたときは、週数の表示だけを更新する。
   見え方の作り直し(サーバー往復)は「表示」を押されるまで待つ。 */
function pvRangeChanged_(){
  P.stale = true;
  var ok   = !!(P.from && P.to);
  var note = document.getElementById('pvNote');
  var show = document.getElementById('pvShow');
  var go   = document.getElementById('pvGo');

  if (show){ show.disabled = !ok; show.classList.toggle('on', ok); }
  if (go) go.disabled = !ok;
  if (!note) return;

  if (!ok){
    note.textContent = '開始日と最終日を選んでください。';
    return;
  }
  var weeks = weekCount_(P.from, P.to);
  note.innerHTML = jp(P.from) + ' 〜 ' + jp(P.to) + ' ＝ ' + weeks + ' 週分 / '
    + weeks + ' ページ。'
    + '<b style="display:inline">［表示］を押すと、この期間の見え方を作り直します。</b>'
    + '（出力は押さなくても、この期間で行われます）';
}

function applyPreset_(key){
  var t = S.week.today, p = t.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var iso = function(x){
    return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0')
         + '-' + String(x.getDate()).padStart(2,'0');
  };
  if (key === 'thisWeek'){ P.from = S.week.weekStart; P.to = addDays(P.from, 6); }
  else if (key === 'lastWeek'){ P.from = addDays(S.week.weekStart, -7); P.to = addDays(P.from, 6); }
  else if (key === 'thisMonth'){
    P.from = iso(new Date(d.getFullYear(), d.getMonth(), 1));
    P.to   = iso(new Date(d.getFullYear(), d.getMonth()+1, 0));
  } else {
    P.from = iso(new Date(d.getFullYear(), d.getMonth()-1, 1));
    P.to   = iso(new Date(d.getFullYear(), d.getMonth(), 0));
  }
}

/* 何週になるか(帳票は週単位なので、端の週はまるごと1ページ) */
function weekCount_(from, to){
  if (!from || !to) return 0;
  var a = new Date(from), b = new Date(to);
  return Math.floor((b - a) / 86400000 / 7) + 1;
}

/* 画面のプレビュー。
   固定の見た目を持たず、テンプレートシートの実寸(列幅・行高・見出し)を
   読んで描きます。シートを直せばここもそのまま追従します。 */
/* 帳票の見出し(colgroup + thead)。プレビューと記録簿ビューで共用します */
function pvHead_(L){
  var px = function(v){ return Math.round(v) + 'px'; };
  var C = L.col;
  // 結合された見出しを復元する(空のセルは直前の見出しの続き)
  var groups = [];
  L.row1.forEach(function(txt, i){
    if (i === 0 || String(txt).trim() !== ''){
      groups.push({ label:String(txt), span:1, first:i });
    } else {
      groups[groups.length - 1].span++;
    }
  });
  return '<colgroup>'
    + L.widths.map(function(w){ return '<col style="width:' + px(w) + '">'; }).join('')
    + '</colgroup><thead><tr style="height:' + px(L.heights[0]) + '">'
    + groups.map(function(g){
        var rs = (g.first === C.DATE - 1) ? ' rowspan="' + L.headRows + '"' : '';
        return '<th' + rs + (g.span > 1 ? ' colspan="' + g.span + '"' : '') + '>'
             + esc(g.label).replace(/\n/g, '<br>') + '</th>';
      }).join('')
    + '</tr><tr style="height:' + px(L.heights[1]) + '">'
    +   '<th class="subhd" colspan="' + (L.cols - C.NOTE + 1) + '">' + esc(L.sub) + '</th>'
    + '</tr></thead>';
}

function printTable_(d){
  var L = d.layout;
  if (!L) return '<div class="logempty">テンプレートが読めませんでした。</div>';

  var R = d.ranges;
  var C = L.col;
  var px = function(v){ return Math.round(v) + 'px'; };

  var head = pvHead_(L);

  // 未記入の日はテンプレートの下地(℃　/ と %)をそのまま出す
  var cell = function(v, r, unit, dec){
    if (v === null || v === undefined) return '<td class="e">' + esc(unit) + '</td>';
    var ng = r && (v < r[0] || v > r[1]);
    return '<td class="e' + (ng ? ' ng' : '') + '">'
         + Number(v).toFixed(dec) + esc(unit) + '</td>';
  };
  var stamp = function(name){
    if (!name) return '<td class="st"></td>';
    var u = d.seals[name];
    return '<td class="st">' + (u ? '<img src="' + u + '" alt="">' : '')
         + '<span>' + esc(name) + '</span></td>';
  };
  var blank = function(n){
    var out = '';
    for (var i = 0; i < n; i++) out += '<td></td>';
    return out;
  };

  var body = d.rows.map(function(r, i){
    var hUp = L.heights[L.headRows + i * L.rowsPerDay];
    var hLo = L.heights[L.headRows + i * L.rowsPerDay + 1];
    return '<tr style="height:' + px(hUp) + '">'
      + '<td class="dt" rowspan="' + L.rowsPerDay + '">' + r.date.replace(/-/g,'/')
      +   '<b>' + r.dow + '</b>' + esc(r.hours) + '</td>'
      + '<td class="n">' + (r.filled && r.rx !== null ? r.rx : '') + '</td>'
      + '<td class="u">' + esc(L.unitRx) + '</td>'
      + '<td class="n">' + (r.filled && r.inquiry !== null ? r.inquiry : '') + '</td>'
      + '<td class="u">' + esc(L.unitInq) + '</td>'
      + blank(C.ROOM_T - C.INQ - 2)          // 単位とG列の間にある列(F列など)
      + cell(r.roomTemp, R.ROOM_TEMP,  L.phTemp,  1)
      + cell(r.roomHumid, R.ROOM_HUMID, L.phHumid, 0)
      + cell(r.coldTemp, R.COLD_TEMP,  L.phTemp,  1)
      + cell(r.coldHumid, R.COLD_HUMID, L.phHumid, 0)
      // 押印欄の並びは設定に従う(担当者印と管理者印を入れ替えても崩れない)
      + (C.STAFF < C.ADMIN ? stamp(r.staff) + stamp(r.admin)
                           : stamp(r.admin) + stamp(r.staff))
      + '</tr>'
      + '<tr style="height:' + px(hLo) + '">'
      +   '<td class="nt" colspan="' + (L.cols - C.NOTE + 1) + '">' + esc(r.note) + '</td>'
      + '</tr>';
  }).join('');

  return '<table class="pv" style="width:' + px(L.widths.reduce(function(a,b){return a+b;},0))
    + '">' + head + '<tbody>' + body + '</tbody></table>';
}

/* ============================================================
   出力

   ボタンは4つありますが、中身は2通りしかありません。

     紙に出す   … 画面に描いてある帳票をそのまま印刷する。待ち時間なし
     PDFにする  … 帳票テンプレート経由でドライブに保存する。1週あたり数秒

   どのボタンから押しても、必ずこの節を通ります。
     記録簿の「印刷」          → printPaper_('ledger')
     出力画面の「この週を…印刷」→ printPaper_('export')
     記録簿の「PDFを出力」      → startExportJob_({ … })  表示中の月ぜんぶ
     出力画面の「この期間を…」  → startExportJob_({ … })  選んだ期間

   用紙・向き・余白はサーバーの CFG.PDF が唯一の出どころです。起動時に
   受け取って印刷用のCSSにも当てるので、ブラウザ印刷とPDF出力で
   刷り上がりが食い違いません。

   PDFの進み具合は、どちらから始めても画面下に固定した帯に出ます。
   長い期間だと数十分かかることがあるので、スクロールしても画面を
   移動しても、残り時間が見えるようにしています。
   ============================================================ */

/* ---------- 紙の設定 ---------- */
var PAPER = { page:'A4', landscape:true, marginIn:0.4 };
applyPaper_();          // 読み込み前でも既定の用紙で刷れるように

/** サーバーから受け取った紙の設定を、印刷用CSSの @page に反映する */
function applyPaper_(p){
  if (p){
    PAPER = {
      page: p.page || 'A4',
      landscape: !!p.landscape,
      marginIn: Number(p.marginIn) || 0.4
    };
  }
  var css = document.getElementById('pageRule');
  if (!css){
    css = document.createElement('style');
    css.id = 'pageRule';
    (document.head || document.documentElement).appendChild(css);
  }
  css.textContent = '@media print{@page{size:' + PAPER.page + ' '
    + (PAPER.landscape ? 'landscape' : 'portrait')
    + ';margin:' + (PAPER.marginIn * 25.4).toFixed(1) + 'mm}}';
}

/** 紙に入る幅(mm)。用紙の幅から左右の余白を引いたもの */
function paperWidthMm_(){
  var w = (String(PAPER.page).toUpperCase() === 'A3')
    ? (PAPER.landscape ? 420 : 297)
    : (PAPER.landscape ? 297 : 210);
  return w - PAPER.marginIn * 25.4 * 2;
}

/* ---------- 紙に出す ---------- */

/** 紙に入る幅を実測して、はみ出す分だけ縮める倍率を返す。
 *  mm から px への換算はブラウザや設定で変わるので、実際に測ります。 */
function printScale_(){
  var probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;width:'
    + paperWidthMm_().toFixed(2) + 'mm';
  document.body.appendChild(probe);
  var avail = probe.offsetWidth;
  document.body.removeChild(probe);

  // いま出ている画面の帳票を測る。隠れている方は幅が0になってしまうため
  var tbl = document.querySelector(
    VIEW === 'export' ? '#pvBody table.pv' : '#lgBody table.pv');
  if (!tbl || !avail) return 1;
  var w = tbl.offsetWidth;
  if (!w || w <= avail) return 1;      // 収まるなら原寸のまま
  return avail / w;
}

/** 画面をそのまま紙に出す。src は 'ledger' か 'export' */
function printPaper_(src){
  if (src === 'ledger'){
    var d = LG.data;
    if (!d) return;
    if (!d.hasTemplate){ toast('帳票テンプレートがありません', true); return; }
    if (lgDirtyCount()){ toast('保存していない行があります。先に保存してください', true); return; }
    if (LG.edit){ LG.edit = false; lgRender(); }   // 入力欄のまま刷らない
  } else {
    if (!P.preview || !P.preview.hasTemplate){
      toast('帳票テンプレートがありません', true);
      return;
    }
  }
  // 描き直した直後に呼ばれることがあるので、反映を待ってから
  setTimeout(function(){ window.print(); }, 60);
}

window.addEventListener('beforeprint', function(){
  var t = document.querySelector('#pvWrap table.pv');
  if (t) t.style.transform = '';                 // 画面用の縮小は外す
  document.documentElement.style.setProperty('--pscale', printScale_().toFixed(4));
});

window.addEventListener('afterprint', function(){
  document.documentElement.style.removeProperty('--pscale');
  if (VIEW === 'export') fitPreview_();
});

/* ---------- PDFにして残す ----------
   1回の呼び出しで何週分もまとめて作るため、そのあいだ画面は止まって見えます。
   週ごとに呼び分けると下準備が増えて全体は遅くなるので、作るのはまとめたまま、
   進み具合だけを別に問い合わせてバーを動かします。
   getExportStatus は保存済みの進捗を読むだけなので、出力は遅くなりません。

   進み具合は画面下に固定した帯に出します。長い期間だと数十分かかることが
   あるので、スクロールしても画面を移動しても、残り時間が見えるようにしています。 */
var JOB = { data:null, busy:false, timer:null, tick:null, shell:'', at0:0 };

/** 前回までの実測(1週あたり何秒)。始める前の見込みに使います */
var EXPORT = { secPerWeek: 0 };

/** 秒を「1時間20分」「3分5秒」のような読める形にする */
function humanSec_(sec){
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + '秒';
  var m = Math.floor(sec / 60), r = sec % 60;
  if (m < 60) return m + '分' + (r ? r + '秒' : '');
  var h = Math.floor(m / 60);
  m = m % 60;
  return h + '時間' + (m ? m + '分' : '');
}

/** 時刻を HH:MM で */
function clock_(d){
  return String(d.getHours()).padStart(2, '0') + ':'
       + String(d.getMinutes()).padStart(2, '0');
}

/** 始める前の見込み。実績が無いうちは出しません */
function estimateSec_(weeks){
  return EXPORT.secPerWeek > 0 ? EXPORT.secPerWeek * weeks : 0;
}

/** 走っているジョブの経過と残りを見積もる */
function jobEta_(j){
  var total = (j.weeks && j.weeks.length) || 0;
  var done  = j.done || 0;
  var out = { total:total, done:done, pct: total ? Math.round(done / total * 100) : 0,
              elapsed:0, remain:0, at:null };

  // 開始時刻はサーバーの値を使い、無ければ押した時刻で代用する
  var t0 = j.startedAt ? new Date(j.startedAt).getTime() : JOB.at0;
  if (!t0) return out;
  out.elapsed = (Date.now() - t0) / 1000;
  if (out.elapsed < 0) out.elapsed = 0;

  // 1週でも終わっていれば実測から、まだなら前回までの実績から見積もる
  var per = done > 0 ? (out.elapsed / done) : EXPORT.secPerWeek;
  if (per > 0 && total > done){
    out.remain = per * (total - done);
    out.at = new Date(Date.now() + out.remain * 1000);
  }
  return out;
}

/** o = { from, to, title, hasTemplate } */
function startExportJob_(o){
  if (JOB.busy){
    toast('ほかの出力を実行中です。終わるまでお待ちください', true);
    return;
  }
  if (!o.from || !o.to){ toast('開始日と最終日を選んでください', true); return; }
  if (!o.hasTemplate){ toast('帳票テンプレートがありません', true); return; }

  var weeks = weekCount_(o.from, o.to);
  var est = estimateSec_(weeks);
  if (!confirm(jp(o.from) + ' 〜 ' + jp(o.to) + ' の ' + weeks + ' 週分をPDFにします。\n'
      + (est ? '前回までの実績から、およそ ' + humanSec_(est) + ' かかる見込みです。\n' : '')
      + 'ドライブの「業務日報_出力」フォルダに保存します。\nよろしいですか？')) return;

  JOB.busy = true;
  JOB.at0 = Date.now();
  JOB.data = {
    state:'running', done:0, weeks:new Array(weeks), title:o.title,
    startedAt: new Date().toISOString()
  };
  renderJob_();

  call('startExport', [{ from:o.from, to:o.to, title:o.title, actor:S.me }], function(job){
    JOB.data = job;
    renderJob_();
    pollJob_();
    pumpJob_();
  }, function(e){ endJob_(); JOB.data = null; renderJob_(); fail(e); });
}

/** 6分の上限があるので、終わるまで小分けに呼び続ける */
function pumpJob_(){
  call('runExportChunk', [], function(job){
    JOB.data = job;
    if (job && job.state === 'running'){
      renderJob_();
      setTimeout(pumpJob_, 400);
    } else {
      endJob_();
      renderJob_();
      if (job && job.state === 'done') toast('PDFを出力しました');
      else if (job && job.state === 'error') toast(job.message || '出力できませんでした', true);
    }
  }, function(e){ endJob_(); renderJob_(); fail(e); });
}

function endJob_(){
  JOB.busy = false;
  stopPollJob_();
  stopTick_();
}

function cancelJob_(){
  if (!confirm('出力を中止します。ここまでの分は保存されません。よろしいですか？')) return;
  call('cancelExport', [], function(){
    endJob_(); JOB.data = null; renderJob_(); toast('中止しました');
  }, function(e){ endJob_(); fail(e); });
}

function closeJob_(){ JOB.data = null; renderJob_(); }

/* 作っているあいだの進み具合だけを別に問い合わせる */
function pollJob_(){
  stopPollJob_();
  var tick = function(){
    if (!JOB.busy){ stopPollJob_(); return; }
    call('getExportStatus', [], function(j){
      if (!JOB.busy){ stopPollJob_(); return; }
      if (j && j.state === 'running'){ JOB.data = j; renderJob_(); }
      JOB.timer = setTimeout(tick, 2000);
    }, function(){ JOB.timer = setTimeout(tick, 3000); });
  };
  JOB.timer = setTimeout(tick, 1500);
}

function stopPollJob_(){
  if (JOB.timer){ clearTimeout(JOB.timer); JOB.timer = null; }
}

/* サーバーへ聞くのは2秒おきでも、経過時間は毎秒動かしたい */
function startTick_(){
  stopTick_();
  JOB.tick = setInterval(function(){
    if (!JOB.data || JOB.data.state !== 'running'){ stopTick_(); return; }
    paintJob_();
  }, 1000);
}

function stopTick_(){
  if (JOB.tick){ clearInterval(JOB.tick); JOB.tick = null; }
}

/** 帯の枠組み。状態が変わったときだけ作り直す(ボタンを付け直さないため) */
function renderJob_(){
  var bar = document.getElementById('jobBar');
  var j = JOB.data;

  if (!j){
    bar.hidden = true;
    document.body.classList.remove('jobbar-on');
    JOB.shell = '';
    stopTick_();
    return;
  }

  bar.hidden = false;
  document.body.classList.add('jobbar-on');
  bar.classList.toggle('done', j.state === 'done');
  bar.classList.toggle('err',  j.state === 'error');

  if (JOB.shell !== j.state){
    JOB.shell = j.state;
    var act = document.getElementById('jobAct');
    if (j.state === 'running'){
      act.innerHTML = '<button class="btn ghost" id="jobCancel">中止する</button>';
      document.getElementById('jobCancel').addEventListener('click', cancelJob_);
      startTick_();
    } else {
      act.innerHTML = '<button class="btn ghost" id="jobClose">閉じる</button>';
      document.getElementById('jobClose').addEventListener('click', closeJob_);
      stopTick_();
    }
  }
  paintJob_();
}

/** 帯の中身。1秒ごとにここだけ書き換える */
function paintJob_(){
  var j = JOB.data;
  if (!j) return;
  var ttl  = document.getElementById('jobTitle');
  var step = document.getElementById('jobStep');
  var fill = document.getElementById('jobFill');
  var time = document.getElementById('jobTime');

  if (j.state === 'done'){
    ttl.textContent = 'PDFを出力しました';
    step.textContent = esc(j.title) + '.pdf（' + j.weeks.length + 'ページ）';
    fill.style.width = '100%';
    time.innerHTML = 'ドライブの「業務日報_出力」フォルダに保存しました。'
      + '　<a href="' + j.pdfUrl + '" target="_blank">PDFを開く</a>';
    return;
  }
  if (j.state === 'error'){
    ttl.textContent = '出力できませんでした';
    step.textContent = '';
    fill.style.width = '0';
    time.textContent = j.message || '';
    return;
  }

  var e = jobEta_(j);
  ttl.textContent = (j.title || '帳票') + ' を作成中';
  step.textContent = e.done + ' / ' + e.total + ' 週（' + e.pct + '%）';
  fill.style.width = e.pct + '%';

  var line = '経過 <b>' + humanSec_(e.elapsed) + '</b>';
  if (e.remain > 0){
    line += ' ／ 残り およそ <b>' + humanSec_(e.remain) + '</b>'
          + '（終わる目安 ' + clock_(e.at) + '）';
  } else if (e.done === 0){
    line += ' ／ 残り時間を計算しています…';
  } else {
    line += ' ／ まもなく終わります';
  }
  line += '<br>この画面を閉じると出力は止まります。開いたままにしてください'
        + '（ほかの画面へ移っても続きます）。';
  time.innerHTML = line;
}

/** 表題。1か月に収まるなら「2026年8月分」、またぐなら日付でつなぐ */
function jobTitle_(from, to){
  var a = from.split('-'), b = to.split('-');
  if (a[0] === b[0] && a[1] === b[1]) return a[0] + '年' + a[1] + '月分';
  return a[0] + a[1] + a[2] + '-' + b[0] + b[1] + b[2];
}

/* ---------- 各ボタンの入口 ---------- */

/** 出力画面「この期間をPDFにする」 */
function startPrint_(){
  startExportJob_({
    from: P.from, to: P.to, title: jobTitle_(P.from, P.to),
    hasTemplate: !!(P.preview && P.preview.hasTemplate)
  });
}

/** 記録簿「PDFを出力」。表示している月ぜんぶ */
function lgExport(){
  var d = LG.data;
  if (!d) return;
  if (lgDirtyCount()){ toast('保存していない行があります。先に保存してください', true); return; }
  startExportJob_({
    from: d.monthStart, to: d.monthEnd, title: d.monthLabel + '分',
    hasTemplate: d.hasTemplate
  });
}

/** 記録簿「印刷」 */
function lgPaper(){ printPaper_('ledger'); }



/* ============================================================
   記録簿ビュー(監査用)

   ・保健所などの立入検査で、その場で見せられる画面です。
     1か月ぶんを、帳票と同じ書式で週ごとに続けて表示します。
     画面の1枚 = 印刷の1ページ なので、見た目のズレが起きません。
   ・既定は閲覧専用です。「編集」を押したときだけ値を直せます。
     監査中にうっかり書き換えてしまう事故を防ぐためで、
     編集中は画面の色が変わります。
   ・印刷は既存のPDF出力(帳票テンプレート経由)をそのまま呼びます。
   ============================================================ */
var LG = { data:null, edit:false, busy:false, dirty:{}, job:null, xfDate:null };
var $lg = document.getElementById('ledger');

/* ---------- 読み込み ----------
   表示・非表示は画面切り替え(showView)が持つので、ここでは中身だけ用意します。
   前に開いていた月を覚えておき、戻ってきたときに同じ月を出します。 */
function lgOpen(anchor){
  LG.edit = false;
  lgLoad(anchor || LG.anchor || (S.week ? S.week.today : null));
}

function lgLoad(anchor){
  document.getElementById('lgBody').innerHTML = '<div class="skeleton"></div>';
  call('getLedger', [anchor || null], function(d){
    LG.data = d; LG.dirty = {}; LG.anchor = d.monthStart;
    lgRender();
  }, fail);
}

function lgNav(anchor){
  if (!anchor) return;
  if (lgDirtyCount() && !confirm('保存していない行があります。移動しますか？')) return;
  LG.dirty = {};
  lgLoad(anchor);
}

/* ---------- 小道具 ---------- */
function lgDirtyCount(){ return Object.keys(LG.dirty).length; }

/** 元の値に、まだ保存していない編集を重ねたもの */
function lgVal(r){ return Object.assign({}, r, LG.dirty[r.date] || {}); }

/** 管理に関する事項を1行にまとめる(サーバー側の xferLine_ と同じ並び) */
function lgNoteOf(v){
  return XFER.map(function(f){ return String(v[f.key] || '').trim(); })
             .filter(function(x){ return x; }).join('／');
}

function lgRow(date){
  var d = LG.data, hit = null;
  if (!d) return null;
  d.weeks.forEach(function(w){
    w.rows.forEach(function(r){ if (r.date === date) hit = r; });
  });
  return hit;
}

/* ---------- 行の操作ボタン ---------- */
function lgActs_(r){
  if (!LG.edit || !r || !r.inMonth || r.future) return '';
  if (LG.dirty[r.date]){
    return '<button class="rowbtn go" data-act="save" data-date="' + r.date + '">保存</button>'
         + '<button class="rowbtn" data-act="undo" data-date="' + r.date + '">取消</button>';
  }
  if (r.state === 'saved' && canApprove(r.date)){
    return '<button class="rowbtn" data-act="approve" data-date="' + r.date + '">承認</button>';
  }
  // 誤って承認したときの戻し道。現在の管理薬剤師だけが押せます
  if (r.approved && canApprove(r.date)){
    return '<button class="rowbtn" data-act="unapprove" data-date="' + r.date + '">承認解除</button>';
  }
  return '';
}

/* 打っている最中に作り直すとフォーカスが飛ぶので、
   値を変えたときは行の見た目だけを更新する */
function lgSet(date, key, val){
  if (!LG.dirty[date]) LG.dirty[date] = {};
  LG.dirty[date][key] = val;
  lgMark(date);
}

function lgMark(date){
  Array.prototype.forEach.call(
    document.querySelectorAll('tr[data-date="' + date + '"]'),
    function(tr){ tr.classList.add('lg-dirty'); });
  var box = document.getElementById('act_' + date);
  if (box) box.innerHTML = lgActs_(lgRow(date));
  lgBar();
}

function lgBusy(date, on){
  Array.prototype.forEach.call(
    document.querySelectorAll('tr[data-date="' + date + '"]'),
    function(tr){ tr.classList.toggle('lg-saving', !!on); });
}

/* ---------- 保存・取消・承認 ---------- */
function lgSave(date){
  var r = lgRow(date);
  if (!r || LG.busy) return;
  if (!S.me){ needStaff(true); toast('担当者を選んでから保存してください', true); return; }

  var v = lgVal(r);
  var payload = { date:date, actor:S.me, rowStaff: v.staff || S.me, force:false };
  var miss = [], outOf = [];

  FIELDS.forEach(function(f){
    var raw = v[f.key];
    if (raw === '' || raw === null || raw === undefined){ miss.push(f.label); return; }
    var n = parseFloat(raw);
    if (isNaN(n) || n < f.min || n > f.max){ miss.push(f.label); return; }
    if (f.range && (n < f.range[0] || n > f.range[1])) outOf.push(f.label);
    payload[f.key] = n;
  });
  if (miss.length){
    toast(jp(date) + '：' + miss.join('・') + ' が未入力です', true);
    return;
  }
  XFER.forEach(function(f){ payload[f.key] = String(v[f.key] || '').trim(); });

  if (outOf.length &&
      !confirm(jp(date) + '\n' + outOf.join('・') + ' が管理基準を外れています。\nこの値のまま記録しますか？')){
    return;
  }

  // 承認済みを直すときは、必ずここで断りを入れる
  if (r.approved){
    if (!confirm(
      jp(date) + ' は承認済みです。\n\n' +
      '修正すると次の2つが起きます。\n' +
      '  ・承認が解除され、管理薬剤師の再承認が必要になります\n' +
      '  ・変更前後の値が変更履歴に記録されます\n\n続けますか？')) return;
    payload.force = true;
  }

  LG.busy = true;
  lgBusy(date, true);
  call('saveLedgerDay', [payload], function(d){
    LG.busy = false;
    LG.data = d;
    delete LG.dirty[date];
    lgRender();
    toast(jp(date) + ' を保存しました');
  }, function(e){
    LG.busy = false; lgBusy(date, false); fail(e);
  });
}

function lgUndo(date){
  delete LG.dirty[date];
  lgRender();
}

function lgApprove(date){
  if (LG.busy) return;
  if (!S.me){ needStaff(true); toast('担当者を選んでください', true); return; }
  if (!confirm(jp(date) + ' の記録を承認します。よろしいですか？')) return;
  LG.busy = true;
  call('approveLedgerDay', [{ date:date, admin:S.me }], function(d){
    LG.busy = false; LG.data = d; lgRender(); toast('承認しました');
  }, function(e){ LG.busy = false; fail(e); });
}

/* ---------- 管理に関する事項(譲渡記録) ----------
   8つの列に分かれているので、1行の文字列として直させると
   元の列に戻せなくなります。そのため小さな画面を開いて項目ごとに入れます。 */
function lgUnapprove(date){
  if (LG.busy) return;
  if (!S.me){ needStaff(true); toast('担当者を選んでください', true); return; }
  if (!confirm(jp(date) + ' の承認を取り消します。\n管理者印は外れ、再承認が必要になります。\nよろしいですか？')) return;
  LG.busy = true;
  call('unapproveLedgerDay', [{ date:date, admin:S.me }], function(d){
    LG.busy = false; LG.data = d; lgRender(); toast('承認を取り消しました');
  }, function(e){ LG.busy = false; fail(e); });
}

function lgOpenXfer(date){
  var r = lgRow(date);
  if (!r) return;
  var v = lgVal(r);
  LG.xfDate = date;

  document.getElementById('xfTitle').textContent =
    jp(date) + '（' + r.dow + '）管理に関する事項';

  document.getElementById('xfBody').innerHTML =
      '<p class="lead-note">医薬品の譲渡・譲受があった日だけ記入します。'
    + '入力した内容は帳票の「管理に関する事項」欄に1行にまとめて印字されます。</p>'
    + '<div class="xfer-body">'
    + XFER.map(function(f){
        var val = v[f.key] == null ? '' : String(v[f.key]);
        var input;
        if (f.type === 'select'){
          input = '<select id="xf_' + f.key + '"><option value=""></option>'
                + f.choices.map(function(c){
                    return '<option' + (c === val ? ' selected' : '') + '>' + esc(c) + '</option>';
                  }).join('')
                + '</select>';
        } else {
          input = '<div class="inputwrap"><input id="xf_' + f.key + '" type="'
                + (f.type === 'month' ? 'month' : 'text') + '" value="' + esc(val) + '"></div>';
        }
        return '<div class="field txt' + (f.wide ? ' wide' : '') + '">'
             + '<label for="xf_' + f.key + '">' + esc(f.label) + '</label>' + input + '</div>';
      }).join('')
    + '</div>'
    + '<div class="actions">'
    +   '<button class="btn primary" id="xfOk">反映する</button>'
    +   '<button class="btn ghost" id="xfClear">記載なしにする</button>'
    + '</div>';

  document.getElementById('xfOverlay').classList.add('open');

  document.getElementById('xfOk').addEventListener('click', function(){
    XFER.forEach(function(f){
      var el = document.getElementById('xf_' + f.key);
      lgSet(LG.xfDate, f.key, el ? String(el.value).trim() : '');
    });
    lgCloseXfer();
    lgRender();
  });
  document.getElementById('xfClear').addEventListener('click', function(){
    XFER.forEach(function(f){ lgSet(LG.xfDate, f.key, ''); });
    lgCloseXfer();
    lgRender();
  });
}
function lgCloseXfer(){ document.getElementById('xfOverlay').classList.remove('open'); }

/* ---------- 表(帳票と同じ書式) ---------- */
function lgTable_(week){
  var d = LG.data, Lay = d.layout;
  if (!Lay) return '';
  var C = Lay.col, R = d.ranges;
  var px = function(x){ return Math.round(x) + 'px'; };
  var span = Lay.cols - C.NOTE + 1;

  var blank = function(n){ var o = ''; for (var i = 0; i < n; i++) o += '<td></td>'; return o; };

  var stamp = function(name, pending){
    if (!name) return '<td class="st"></td>';
    var u = d.seals[name];
    return '<td class="st">' + (u ? '<img src="' + u + '" alt="">' : '')
         + '<span>' + esc(name) + '</span>'
         + (pending ? '<i class="pend">未承認</i>' : '') + '</td>';
  };

  var body = week.rows.map(function(r, i){
    var v  = lgVal(r);
    var ed = LG.edit && r.inMonth && !r.future;
    var hUp = Lay.heights[Lay.headRows + i * Lay.rowsPerDay];
    var hLo = Lay.heights[Lay.headRows + i * Lay.rowsPerDay + 1];

    var cls = [];
    if (!r.inMonth)      cls.push('lg-out');
    else if (r.future)   cls.push('lg-fut');
    else if (!r.filled)  cls.push('lg-miss');
    else if (r.approved) cls.push('lg-appr');
    if (LG.dirty[r.date]) cls.push('lg-dirty');
    var attr = ' data-date="' + r.date + '" class="' + cls.join(' ') + '"';

    // 枚数・件数
    var n = function(key, step){
      var val = (v[key] === null || v[key] === undefined) ? '' : v[key];
      if (!ed) return '<td class="n">' + ((r.filled && val !== '') ? esc(val) : '') + '</td>';
      return '<td class="n ed"><input type="number" step="' + step + '"'
           + ' data-d="' + r.date + '" data-k="' + key + '" value="' + esc(val) + '"></td>';
    };

    // 温度・湿度。未記入の日はテンプレートの下地(℃　/ や %)をそのまま出す
    var e = function(key, range, ph, dec){
      var val = v[key];
      if (ed){
        return '<td class="e ed"><input type="number" step="' + (dec ? '0.1' : '1') + '"'
             + ' data-d="' + r.date + '" data-k="' + key + '"'
             + ' value="' + ((val === null || val === undefined) ? '' : esc(val)) + '"></td>';
      }
      if (val === null || val === undefined || val === '') return '<td class="e">' + esc(ph) + '</td>';
      var ng = range && (val < range[0] || val > range[1]);
      return '<td class="e' + (ng ? ' ng' : '') + '">' + Number(val).toFixed(dec) + esc(ph) + '</td>';
    };

    var dt = '<td class="dt" rowspan="' + Lay.rowsPerDay + '">'
      + r.date.replace(/-/g, '/') + '<b>' + r.dow + '</b>' + esc(r.hours)
      + '<span class="rowact" id="act_' + r.date + '">' + lgActs_(r) + '</span>'
      + '</td>';

    var note = ed
      ? '<td class="nt ed" colspan="' + span + '">'
        + '<button class="notebtn' + (lgNoteOf(v) ? '' : ' empty') + '"'
        + ' data-act="xfer" data-date="' + r.date + '">'
        + (lgNoteOf(v) ? esc(lgNoteOf(v)) : '＋ 譲渡・譲受を記入') + '</button></td>'
      : '<td class="nt" colspan="' + span + '">' + esc(lgNoteOf(v)) + '</td>';

    // 入力者と、その日の担当者は別人のことがある。
    // 代わりに入れた人の名前で押印しないよう、編集中は選べるようにする
    var stStaff = ed
      ? '<td class="st ed"><select class="stsel" data-d="' + r.date + '" data-k="staff">'
        + '<option value=""></option>'
        + activeStaff().map(function(x){
            return '<option' + (x.name === v.staff ? ' selected' : '') + '>' + esc(x.name) + '</option>';
          }).join('')
        + '</select></td>'
      : stamp(r.staff, false);
    var stAdmin = stamp(r.admin, r.filled && !r.approved);

    return '<tr' + attr + ' style="height:' + px(hUp) + '">'
      + dt
      + n('rx', '1')
      + '<td class="u">' + esc(Lay.unitRx) + '</td>'
      + n('inquiry', '1')
      + '<td class="u">' + esc(Lay.unitInq) + '</td>'
      + blank(C.ROOM_T - C.INQ - 2)
      + e('roomTemp',  R.ROOM_TEMP,  Lay.phTemp,  1)
      + e('roomHumid', R.ROOM_HUMID, Lay.phHumid, 0)
      + e('coldTemp',  R.COLD_TEMP,  Lay.phTemp,  1)
      + e('coldHumid', R.COLD_HUMID, Lay.phHumid, 0)
      + (C.STAFF < C.ADMIN ? stStaff + stAdmin : stAdmin + stStaff)
      + '</tr>'
      + '<tr' + attr + ' style="height:' + px(hLo) + '">' + note + '</tr>';
  }).join('');

  return '<table class="pv" style="width:'
    + px(Lay.widths.reduce(function(a, b){ return a + b; }, 0)) + '">'
    + pvHead_(Lay) + '<tbody>' + body + '</tbody></table>';
}

/* ---------- 画面全体 ---------- */
function lgStat_(k, v, cls){
  return '<div class="lg-stat ' + (cls || '') + '">'
       + '<span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
}

function lgBar(){
  var n = lgDirtyCount();
  document.getElementById('lgDirty').textContent = n ? ('未保存 ' + n + ' 行') : '';
  // 別の画面にいても、書きかけがあることが分かるようにする
  document.getElementById('navLedgerDot').hidden = !n;
}

function lgRender(){
  var d = LG.data;
  if (!d) return;

  $lg.classList.toggle('editing', LG.edit);
  document.getElementById('lgStore').textContent = d.store;
  document.getElementById('lgMonth').textContent = d.monthLabel;
  document.getElementById('lgNext').disabled = !d.nextMonth;

  var eb = document.getElementById('lgEdit');
  eb.setAttribute('aria-pressed', LG.edit ? 'true' : 'false');
  eb.textContent = LG.edit ? '編集中' : '編集';

  var s = d.stat;
  var target = s.days - s.future;          // まだ来ていない日は分母から外す
  document.getElementById('lgStats').innerHTML =
      lgStat_('対象日数', s.days + ' 日', '')
    + lgStat_('記録あり', s.filled + ' / ' + target + ' 日', s.missing ? 'warn' : 'ok')
    + lgStat_('承認済み', s.approved + ' 日',
        (s.filled && s.approved === s.filled) ? 'ok' : (s.filled ? 'warn' : ''))
    + lgStat_('未記録', s.missing + ' 日', s.missing ? 'crit' : 'ok')
    + lgStat_('基準逸脱', s.alerts + ' 件', s.alerts ? 'warn' : 'ok');

  var al = document.getElementById('lgAlerts');
  al.hidden = !d.alerts.length;
  al.innerHTML = d.alerts.length
    ? '<b>管理基準を外れた記録（' + d.alerts.length + ' 日）</b>'
      + d.alerts.map(function(a){
          return '<span class="algrp">' + a.date.slice(5).replace('-', '/') + '(' + a.dow + ')　'
            + a.items.map(function(x){
                return esc(x.label) + ' ' + x.value + '（基準 ' + x.min + '〜' + x.max + '）';
              }).join('、') + '</span>';
        }).join('')
    : '';

  if (!d.hasTemplate){
    document.getElementById('lgBody').innerHTML =
        '<div class="blockmsg"><div><b>帳票テンプレートがありません</b>'
      + 'スクリプトエディタで buildTemplate を1回実行してください。'
      + '実行すると「帳票テンプレート」シートが作られ、この画面に実際の書式で表示されます。'
      + '</div></div>';
  } else {
    document.getElementById('lgBody').innerHTML = d.weeks.map(function(w, i){
      return '<section class="lg-week">'
        + '<h3>第' + (i + 1) + '週'
        +   '<span class="pg">' + w.start.replace(/-/g, '/') + ' 〜 '
        +     w.end.slice(5).replace('-', '/') + '</span>'
        +   '<span class="pg right">印刷 ' + (i + 1) + ' / ' + d.weeks.length + ' ページ</span>'
        + '</h3>'
        + '<div class="lg-sheet">' + lgTable_(w) + '</div>'
        + '</section>';
    }).join('');
  }

  document.getElementById('lgFoot').innerHTML =
      '<div class="lg-note"><b>この画面について</b>'
    + '帳票テンプレートと同じ書式で表示しています。1週 = 印刷1ページです。<br>'
    + '<b style="display:inline">印刷</b>… この画面をそのまま紙に出します。'
    + 'サーバーを介さないのですぐ出ます（' + d.weeks.length + 'ページ）。<br>'
    + '<b style="display:inline">PDFを出力</b>… ドライブの「業務日報_出力」フォルダに'
    + d.monthLabel + '分を保存します。控えを残すときはこちら（1週あたり数秒）。<br>'
    + '承認済みの日を直すと、承認は自動的に解除され、変更前後の値が変更履歴に残ります。'
    + '直したあとは管理薬剤師の再承認が必要です。</div>';

  lgBar();
}

/* 表は作り直しが多いので、個別に付けずにまとめて拾う */
function lgOnEdit_(ev){
  var el = ev.target;
  if (!el || !el.getAttribute) return;
  var date = el.getAttribute('data-d');
  var key  = el.getAttribute('data-k');
  if (date && key) lgSet(date, key, el.value);
}
document.getElementById('lgBody').addEventListener('input', lgOnEdit_);
document.getElementById('lgBody').addEventListener('change', lgOnEdit_);

document.getElementById('lgBody').addEventListener('click', function(ev){
  var b = ev.target;
  while (b && b !== this && !b.getAttribute('data-act')) b = b.parentNode;
  if (!b || b === this) return;
  var act  = b.getAttribute('data-act');
  var date = b.getAttribute('data-date');
  if (act === 'save')         lgSave(date);
  else if (act === 'undo')    lgUndo(date);
  else if (act === 'approve') lgApprove(date);
  else if (act === 'unapprove') lgUnapprove(date);
  else if (act === 'xfer')    lgOpenXfer(date);
});

    lgCloseXfer();

});

/* ============================================================
   プレビュー用のダミーデータ
   ブラウザで直接開いたときだけ使われる(GAS上では使われない)
   ============================================================ */
var MOCK = (function(){
  var today = new Date();
  // 帳票は土曜始まりの1週間
  var weekTop = new Date(today);
  weekTop.setDate(today.getDate() - ((today.getDay() - 6 + 7) % 7));

  function iso(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
         + '-' + String(d.getDate()).padStart(2,'0');
  }
  function shift(base, n){ var d = new Date(base); d.setDate(d.getDate()+n); return iso(d); }
  function stamp(){
    var n = new Date();
    return String(n.getMonth()+1).padStart(2,'0')+'/'+String(n.getDate()).padStart(2,'0')
         + ' ' + String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  }
  var DOW = ['日','月','火','水','木','金','土'];
  var todayIso = iso(today);
  var seq = 5, tseq = 3, authMode = 'select', demoRegistered = true;

              stat.alerts += r.alerts.length;

        start: w.days[0].date, end: w.days[6].date,
        hours:'10:00〜20:00',
        ranges:{ ROOM_TEMP:[1,30], ROOM_HUMID:[30,70], COLD_TEMP:[2,8], COLD_HUMID:null },
        hasTemplate: true,
        seals: seals,
        rows: w.days.map(function(d){
          var filled = d.state === 'saved' || d.state === 'approved';
          var note = ['xKind','xPartner','xMaker','xDrug','xPack','xQty','xLot','xExpiry']
            .map(function(k){ return d[k]; }).filter(function(x){ return x; }).join('／');
          return { date:d.date, dow:d.dow, hours:'10:00〜20:00',
            rx:d.rx, inquiry:d.inquiry, note:note,
            roomTemp:d.roomTemp, roomHumid:d.roomHumid,
            coldTemp:d.coldTemp, coldHumid:d.coldHumid,
            filled:filled, approved:d.state === 'approved',
            admin: d.admin || chiefOn(d.date), staff:d.staff };
        })
      };
    },

    startExport: function(p){
      var weeks = [], a = new Date(p.from), b = new Date(p.to);
      while (a <= b){
        weeks.push(a.toISOString().slice(0,10));
        a.setDate(a.getDate() + 7);
      }
      job = { from:p.from, to:p.to, title:p.title, weeks:weeks, done:0,
              startedAt: new Date().toISOString(),
              state:'running', pdfUrl:'' };
      return job;
    },
    runExportChunk: function(){
      if (!job || job.state !== 'running') return job;
      job.done = Math.min(job.weeks.length, job.done + 1);
      if (job.done >= job.weeks.length){
        job.state = 'done';
        job.pdfUrl = 'https://drive.google.com/(プレビューでは実際のPDFは作られません)';
      }
      return job;
    },
    cancelExport: function(){ if (job) job.state = 'canceled'; return job; },
    getExportStatus: function(){ return job; },

    claimDay: function(p){
      if (!store[p.date]) store[p.date] = { state:'editing', lockedBy:p.staff };
      return week(p.date);
    },
    releaseDay: function(p){
      var r = store[p.date];
      if (r && r.state === 'editing' && r.lockedBy === p.staff) delete store[p.date];
      return true;
    },

    saveDay: function(p){
      var now = new Date();
      store[p.date] = { state:'saved',
        rx:p.rx, inquiry:p.inquiry,
        roomTemp:p.roomTemp, roomHumid:p.roomHumid,
        coldTemp:p.coldTemp, coldHumid:p.coldHumid,
        xKind:p.xKind||'', xPartner:p.xPartner||'', xMaker:p.xMaker||'', xDrug:p.xDrug||'',
        xPack:p.xPack||'', xQty:p.xQty||'', xLot:p.xLot||'', xExpiry:p.xExpiry||'',
        staff:p.staff,
        savedAt: String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
        admin:'', approvedAt:'' };
      return week(p.date);
    },

    approveDay: function(p){
      var r = store[p.date]; if (!r) throw new Error('記録がありません');
      var now = new Date();
      r.state = 'approved'; r.admin = p.admin;
      r.approvedAt = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      return week(p.date);
    },

    getStaffMaster: function(){ return master(); },

    addStaff: function(p){
      var name = String(p.name || '').trim();
      if (!name) throw new Error('氏名を入力してください');
      if (staff.some(function(s){ return s.name === name; }))
        throw new Error(name + ' さんは既に名簿にあります');
      staff.push({ id:'s'+(seq++), name:name, active:true });
      push('担当者を追加', name, p.actor);
      return master();
    },

    updateStaff: function(p){
      var s = findStaff(p.id); if (!s) throw new Error('名簿にありません');
      if (p.active === false && chiefOn(todayIso) === s.name)
        throw new Error('現在の管理薬剤師です。先に交代を登録してください');
      if (p.active !== undefined){
        s.active = !!p.active;
        push(s.active ? '担当者を復帰' : '担当者を退職', s.name, p.actor);
      }
      return master();
    },

    removeStaff: function(p){
      var s = findStaff(p.id); if (!s) throw new Error('名簿にありません');
      if (records(s.name) > 0)
        throw new Error('日報に記録が残っているため削除できません。退職にしてください');
      if (terms.some(function(t){ return t.staffId === s.id; }))
        throw new Error('管理薬剤師の履歴が残っているため削除できません。退職にしてください');
      staff = staff.filter(function(x){ return x.id !== s.id; });
      push('担当者を削除', s.name, p.actor);
      return master();
    },

    setSeal: function(p){
      var s = findStaff(p.id); if (!s) throw new Error('名簿にありません');
      if (!/^data:image\/png;base64,/.test(p.dataUrl || ''))
        throw new Error('画像を読み込めませんでした');
      s.sealUrl = p.dataUrl;                    // 本番ではDriveに保存してファイルIDを持つ
      push('印影を登録', s.name, p.actor);
      return master();
    },

    removeSeal: function(p){
      var s = findStaff(p.id); if (!s) throw new Error('名簿にありません');
      delete s.sealUrl;
      push('印影を削除', s.name, p.actor);
      return master();
    },

    setChief: function(p){
      var s = findStaff(p.staffId); if (!s) throw new Error('名簿にありません');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(p.from)) throw new Error('就任日の形式が正しくありません');
      if (terms.some(function(t){ return t.from === p.from; }))
        throw new Error('同じ就任日の登録が既にあります');
      var prev = chiefOn(p.from);
      terms.push({ id:'t'+(tseq++), staffId:s.id, name:s.name, from:p.from });
      push('管理薬剤師の交代',
        (prev ? prev + ' → ' : '') + s.name + '(' + p.from + ' から)', p.actor);
      return master();
    },

    updateTerm: function(p){
      var t = findTerm(p.id); if (!t) throw new Error('任期がありません');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(p.from)) throw new Error('就任日の形式が正しくありません');
      if (terms.some(function(x){ return x.id !== t.id && x.from === p.from; }))
        throw new Error('同じ就任日の登録が既にあります');
      var before = t.from;
      t.from = p.from;
      push('就任日を変更', t.name + '：' + before + ' → ' + p.from, p.actor);
      return master();
    },

    removeTerm: function(p){
      var t = findTerm(p.id); if (!t) throw new Error('任期がありません');
      if (terms.length === 1) throw new Error('管理薬剤師が0人になります');
      terms = terms.filter(function(x){ return x.id !== t.id; });
      push('任期を削除', t.name + '(' + t.from + ' 〜)', p.actor);
      return master();
    }
  };
})();

/* プレビューでだけ、認証方式(プルダウン / Googleアカウント)を切り替えて見比べられるようにする */
if (!IS_GAS){
  document.getElementById('demoToggle').addEventListener('click', function(){
    var toGoogle = (S.auth.mode !== 'google');
    MOCK.setAuthMode(toGoogle ? 'google' : 'select');
    MOCK.setDemoRegistered(true);
    this.textContent = toGoogle ? '担当プルダウンの表示に戻す' : 'Googleアカウント方式の表示を見る';
    S.sel = null; S.editing = false;
    boot();
  });
}

boot();
